# F-1 (2026-08-13 audit, the H-2 follow-through): a bespoke private key has entered this tree
# three times. This gate makes the fourth attempt fail CI instead of shipping.
name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan tracked files for committed keys
        run: bash scripts/secret-scan.sh
