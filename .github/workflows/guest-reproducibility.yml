name: Guest reproducibility

# Two machines, one commit, one set of guest ELF digests — or the build is not reproducible and a
# vkey is a property of whoever compiled it rather than of the source.
#
# This is not a nicety. `SP1JournalVerifier` pins a vkey at construction and the factory pins the
# verifier, so a vkey derived from a build nobody else can reproduce is a mistake that costs a new
# verifier AND a new factory to undo. It is also the "reproducible-build artifact so anyone can
# check vkey <-> source" that research/UPGRADE_GOVERNANCE.md already promises as a Lane C
# requirement, and which could not be produced before `--docker`.
#
# Succinct's own documentation is explicit that the plain path is not enough: "Running
# `cargo prove build` may not generate a reproducible ELF which is necessary for verifying that
# your binary corresponds to given source code." Every guest build in this repo now takes the
# `--docker` path, pinned at the same tag.

on:
  pull_request:
    paths:
      - 'crates/**'
      - 'zk/**'
      - 'taskfile/zk.yml'
      - 'scripts/guest-elf-digests.sh'
      - '.github/workflows/guest-reproducibility.yml'
  workflow_dispatch:
  # Called by the release workflow, so a release cannot publish an image whose guests two
  # machines disagree about.
  workflow_call:
    outputs:
      digests:
        description: 'sha256 of every guest ELF, one per line'
        value: ${{ jobs.compare.outputs.digests }}

concurrency:
  group: guest-reproducibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Guests, build ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # TWO COLD RUNNERS OF THE SAME ARCHITECTURE, deliberately, and the reasoning is worth
          # keeping because the obvious design is the other one.
          #
          # The failure this gate exists to catch is the one research/VKEY_NOTES.md measured: a
          # toolchain REINSTALL shifted vkeys with zero source change. That is a
          # same-architecture, different-environment problem, and what tests it is two machines
          # with cold caches and no shared state — which is exactly this.
          #
          # An arm64 leg looks like more independence and is mostly not. The pinned SP1 builder
          # image is amd64-only, so an arm64 runner executes THE SAME amd64 container under QEMU:
          # same image digest, same toolchain, same rustflags, different host CPU. It is the same
          # build on a slower processor rather than an independent one.
          #
          # Measured on v0.0.2 before this changed: native x86_64 built all five guests in 5m52s;
          # the emulated arm64 leg took 13, 11, 9 and 9 minutes for the first four and was
          # externally terminated 43 minutes in, two minutes into the fifth. Nobody cancelled it —
          # a free arm64 runner was reclaimed — and there is no way to stop that recurring, which
          # is a poor property for something a release gates on.
          #
          # To get that axis back for one run, add `{ id: gamma, runner: ubuntu-24.04-arm }` here
          # along with a `docker/setup-qemu-action@v3` step, and expect roughly an hour.
          - id: alpha
            runner: ubuntu-latest
          - id: beta
            runner: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install SP1 toolchain (pinned 6.3.1)
        run: |
          curl -L https://sp1up.succinct.xyz | bash
          ~/.sp1/bin/sp1up --version v6.3.1
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"

      # No rust-cache here on purpose. A warm `target/` is the most likely way for a build to
      # agree with itself for the wrong reason, and this job's whole output is a claim about a
      # cold, independent build.
      - name: Build every guest reproducibly
        run: sh scripts/build-guests.sh

      - name: Digest table
        run: |
          sh scripts/guest-elf-digests.sh | tee "digests-${{ matrix.id }}.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: guest-digests-${{ matrix.id }}
          path: digests-${{ matrix.id }}.txt
          retention-days: 7

      - name: Keep the ELFs from one of the builds
        if: matrix.id == 'alpha'
        run: |
          set -eu
          # The ELF FILES, at the paths cargo actually put them — not the directories holding
          # them, which are ~800 MB of build state around 4.7 MB of artifact, downloaded again by
          # every job that needs the guests. The paths are derived rather than guessed, because
          # the obvious guess is wrong for the nostr guest (see scripts/guest-elf-dirs.sh).
          sh scripts/guest-elf-dirs.sh --files | tee guest-elfs.txt
          tar -czf sp1-guest-elfs.tar.gz -T guest-elfs.txt
          ls -lh sp1-guest-elfs.tar.gz

      - uses: actions/upload-artifact@v4
        if: matrix.id == 'alpha'
        with:
          name: sp1-guest-elfs
          path: sp1-guest-elfs.tar.gz
          retention-days: 7

  compare:
    name: The two builds must agree
    needs: build
    runs-on: ubuntu-latest
    outputs:
      digests: ${{ steps.compare.outputs.digests }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: guest-digests-*
          merge-multiple: true

      - id: compare
        run: |
          set -eu
          test -s digests-alpha.txt || { echo "build alpha produced no digests"; exit 1; }
          test -s digests-beta.txt  || { echo "build beta produced no digests"; exit 1; }
          # A short table two builds agree about is agreement about nothing, so the count is
          # checked as well as the content. `guest-elf-digests.sh` refuses to emit a short one,
          # and this is the second half of that belt.
          COUNT=$(wc -l < digests-alpha.txt)
          [ "$COUNT" -ge 9 ] || { echo "only $COUNT guest ELFs in the table; expected at least 9"; exit 1; }
          if ! diff -u digests-alpha.txt digests-beta.txt; then
            echo ""
            echo "Two machines built this commit and disagreed about the guest bytes."
            echo "Until they agree, a vkey is a property of the machine that produced it and"
            echo "must not be pinned into a verifier: see research/operations/addresses-and-vkeys.md."
            exit 1
          fi
          echo "$COUNT guest ELFs, identical on two independent cold builds:"
          cat digests-alpha.txt
          {
            echo 'digests<<EOF'
            cat digests-alpha.txt
            echo EOF
          } >> "$GITHUB_OUTPUT"
