name: Solidity

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - uses: actions/setup-node@v4
        name: Install Node.js
        with:
          node-version: 21

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.18.3

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Install deps
        run: task --yes setup

      - name: Run forge build
        run: forge build -vvv

      - name: Run forge tests
        run: forge test -vvv
        env:
          # M6 hardening: a deeper fuzz budget in CI than the local default.
          FOUNDRY_FUZZ_RUNS: "1024"
