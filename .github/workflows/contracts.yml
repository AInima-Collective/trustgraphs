name: Solidity

on:
  pull_request:
  workflow_call:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - uses: actions/setup-node@v4
        name: Install Node.js
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Install deps
        run: task --yes setup

      - name: Test deployment tooling
        run: pnpm test:deploy

      - name: Check Solidity formatting
        run: forge fmt --check

      - name: Run Solidity static analysis
        # Solc 0.8.36 reserves future keywords used by pinned OZ/Safe dependencies (6335).
        # Keep Foundry's existing Safe assembly-comment exception (2424) when overriding codes.
        # Neither exception disables high-severity security lints.
        run: forge lint contracts/src --severity high --deny warnings --ignored-error-codes 6335 --ignored-error-codes 2424

      - name: Run forge build
        run: forge build -vvv

      - name: Run forge tests
        run: forge test -vvv
        env:
          # M6 hardening: a deeper fuzz budget in CI than the local default.
          FOUNDRY_FUZZ_RUNS: '1024'
