name: Release

# Cut a release from a tag: a multi-arch operator image, a build-provenance attestation, and the
# table of guest ELF digests and vkeys that the image was built from.
#
# There are no tags on this repository yet, so this also defines the convention: `vMAJOR.MINOR.PATCH`
# on a commit that is already merged. Nothing here can be produced from a laptop, which is the
# point — a vkey that gets pinned into an immutable verifier should trace to a public workflow run
# on a public commit, which is what research/UPGRADE_GOVERNANCE.md already asks for.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  IMAGE: ghcr.io/jakehartnell/trustgraphs-operator

permissions: {}

jobs:
  # The gate. Two cold runners build the guests and must produce identical ELF digests; if they
  # do not, nothing below runs, because an image and a vkey table nobody else can reproduce are
  # worse than no release at all. Two COLD BUILDS, not two architectures: the pinned SP1 builder
  # image is amd64-only, so an arm64 runner runs that same container under emulation and would
  # be comparing a build against itself.
  guests:
    name: Reproducible guests
    uses: ./.github/workflows/guest-reproducibility.yml
    # A called workflow inherits the caller's permissions, and this workflow declares none by
    # default. Without this, the checkout inside it fails.
    permissions:
      contents: read

  manifest:
    name: Guest digest and vkey table
    needs: guests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # `sp1-sdk` reaches `prost-build` through `sp1-prover-types`, whose build script needs
      # protoc — even for the DEFAULT feature set, and even though nothing here talks to the
      # prover network. It is a build script inside a transitive normal dependency, which is
      # exactly what `cargo tree --edges build` does not show; `cargo tree -i prost-build` does.
      - uses: arduino/setup-protoc@v3
        with:
          version: "27.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zk/prover -> target

      - uses: actions/download-artifact@v4
        with:
          name: sp1-guest-elfs

      - name: Restore the guests the gate just agreed on
        run: tar -xzf sp1-guest-elfs.tar.gz

      # This is the Lane C artifact research/UPGRADE_GOVERNANCE.md commits us to: every program's
      # ELF sha256 and vkey, against a public source commit, produced by a public workflow run.
      - name: Derive the table
        env:
          SP1_SKIP_PROGRAM_BUILD: 'true'
          SP1_PROVER: mock
        run: |
          set -eu
          cargo run --release --locked --manifest-path zk/prover/Cargo.toml -- manifest \
            --commit "${GITHUB_SHA}" --tag "${GITHUB_REF_NAME}" > guest-manifest.json
          cat guest-manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: guest-manifest
          path: guest-manifest.json
          retention-days: 30

  image:
    name: Image (${{ matrix.platform }})
    needs: [guests, manifest]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners rather than QEMU: a cold Rust build of this size under emulation is the
          # difference between minutes and hours. amd64 is what Railway runs; arm64 is what an
          # Apple Silicon self-hoster runs.
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64
    steps:
      - uses: actions/checkout@v4

      # A cold Rust build across several feature sets plus Docker layers is the likeliest way to
      # run a standard runner out of disk. This buys back roughly 25 GB and costs seconds.
      - name: Free runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost
          df -h /

      - uses: actions/download-artifact@v4
        with:
          name: sp1-guest-elfs

      - name: Restore the guests the gate just agreed on
        run: tar -xzf sp1-guest-elfs.tar.gz

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Read the digest out of the table the previous job already published, rather than
      # recomputing it here. Two reasons: one number with one source cannot disagree with itself,
      # and this job installs no Rust toolchain — deriving it needs `cargo locate-project`, which
      # is present on ubuntu-latest and not something to assume on the arm64 runner.
      - uses: actions/download-artifact@v4
        with:
          name: guest-manifest

      - name: The guest this image carries
        id: elf
        run: |
          set -eu
          TRUST_GRAPH=$(jq -r '.programs[] | select(.program=="trust-graph") | .elf_sha256' \
                          guest-manifest.json)
          case "$TRUST_GRAPH" in
            ????????????????????????????????????????????????????????????????) ;;
            *) echo "no trust-graph ELF digest in guest-manifest.json"; exit 1 ;;
          esac
          echo "trust-graph=$TRUST_GRAPH" >> "$GITHUB_OUTPUT"
          echo "trust-graph guest: $TRUST_GRAPH"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: zk/operator/Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            SOURCE_COMMIT=${{ github.sha }}
            TRUST_GRAPH_ELF_SHA256=${{ steps.elf.outputs.trust-graph }}
          # `ignore-error` because a cache export failure is a slow next build, not a bad
          # release, and the GHA cache backend is the least predictable thing in this job.
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }},ignore-error=true
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # A matrix job cannot carry per-leg outputs — every leg writes the same `outputs` key and
      # the last one to finish wins, silently. Each leg leaves its digest as a file instead, and
      # the next job collects them.
      - name: Leave the digest for the manifest job
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest" || { echo "the build produced no digest"; exit 1; }
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Multi-arch manifest and attestation
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.list.outputs.digest }}
      tag: ${{ steps.list.outputs.tag }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          path: digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Create the manifest list
        id: list
        working-directory: digests
        run: |
          set -eu
          # A tag release is `vX.Y.Z`; anything else (a workflow_dispatch dry run) publishes as
          # `edge` and must NOT move `latest`, which means "the newest RELEASE" to anyone pulling.
          TAG="${GITHUB_REF_NAME}"
          LATEST=""
          case "$TAG" in
            v*) LATEST="--tag ${IMAGE}:latest" ;;
            *)  TAG="edge" ;;
          esac
          # One file per architecture, named by its digest.
          COUNT=$(ls -1 | wc -l)
          [ "$COUNT" -eq 2 ] || { echo "expected 2 per-arch digests, found $COUNT"; ls -la; exit 1; }
          # shellcheck disable=SC2086
          docker buildx imagetools create \
            --tag "${IMAGE}:${TAG}" \
            $LATEST \
            $(printf "${IMAGE}@sha256:%s " *)
          DIGEST=$(docker buildx imagetools inspect "${IMAGE}:${TAG}" --format '{{json .Manifest}}' | jq -r .digest)
          # Named here rather than three jobs later. An empty or malformed digest would fail the
          # attestation, and then the anonymous pull, with errors about neither.
          case "$DIGEST" in
            sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "imagetools returned no usable index digest: '$DIGEST'"; exit 1 ;;
          esac
          echo "published ${IMAGE}:${TAG} at $DIGEST"
          echo "tag=$TAG"       >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # Cryptographically traceable to this workflow run and this commit, rather than to a
      # person's laptop.
      - uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.list.outputs.digest }}
          push-to-registry: true

  verify:
    name: The published image is what the table says
    needs: [manifest, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: guest-manifest

      # D8: anonymous `docker pull`, no GitHub account. A GHCR package pushed by GITHUB_TOKEN is
      # created PRIVATE regardless of the repository being public, and the visibility has to be
      # flipped by hand once, in the package settings. This step is why that is discovered here
      # rather than by a stranger being asked to authenticate.
      - name: Pull with no credentials at all
        run: |
          set -eu
          docker logout ghcr.io || true
          rm -f "$HOME/.docker/config.json"
          if ! docker pull "${IMAGE}@${{ needs.publish.outputs.digest }}"; then
            echo ""
            echo "The image could not be pulled anonymously. A GHCR package created by"
            echo "GITHUB_TOKEN is private by default, even on a public repository."
            echo "Fix, once: https://github.com/users/JakeHartnell/packages/container/trustgraphs-operator/settings"
            echo "  -> Danger Zone -> Change visibility -> Public, then re-run this job."
            exit 1
          fi

      # The strongest form of the guard: re-derive the vkeys from the ELFs EMBEDDED IN THE IMAGE
      # and require them to match the table that is about to be published. A table that describes
      # a different build than the image is worse than no table.
      - name: Re-derive the vkeys inside the image
        run: |
          set -eu
          docker run --rm --entrypoint /usr/local/bin/trustgraph-prover \
            -e SP1_PROVER=mock \
            "${IMAGE}@${{ needs.publish.outputs.digest }}" manifest > from-image.json
          jq -S '[.programs[] | {program, elf_sha256, vkey}]' guest-manifest.json > a.json
          jq -S '[.programs[] | {program, elf_sha256, vkey}]' from-image.json    > b.json
          if ! diff -u a.json b.json; then
            echo "the published image does not carry the guests the table describes"
            exit 1
          fi
          echo "image and table agree"

  release:
    name: Publish the release
    needs: [manifest, publish, verify]
    # Only a real tag gets a GitHub Release. A `workflow_dispatch` dry run exercises everything
    # above this — the guests, the vkey table, both images, the attestation, the anonymous pull —
    # and then stops, because `action-gh-release` requires a tag and inventing one from a branch
    # name would publish a release nobody asked for.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: guest-manifest

      - name: Release notes
        run: |
          set -eu
          {
            echo "## Operator image"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${{ needs.publish.outputs.tag }}"
            echo '```'
            echo
            echo "Digest: \`${{ needs.publish.outputs.digest }}\`"
            echo
            echo "Built by [this workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})"
            echo "from \`${GITHUB_SHA}\`, with a build-provenance attestation you can check without"
            echo "an account:"
            echo
            echo '```'
            echo "gh attestation verify oci://${IMAGE}:${{ needs.publish.outputs.tag }} --repo ${GITHUB_REPOSITORY}"
            echo '```'
            echo
            echo "## Guest programs"
            echo
            echo "Every guest was built inside the pinned SP1 builder image, twice, on two cold"
            echo "runners that share no state, and produced identical bytes before this release"
            echo "was cut. Two cold builds rather than two architectures: the pinned SP1 builder"
            echo "image is amd64-only, so an arm64 runner would run that same container under"
            echo "emulation and compare a build against itself. \`guest-manifest.json\` is"
            echo "attached; the same values are reproducible from source with:"
            echo
            echo '```'
            echo "sh scripts/build-guests.sh && sh scripts/guest-elf-digests.sh"
            echo '```'
            echo
            echo '| program | ELF sha256 | vkey |'
            echo '| --- | --- | --- |'
            jq -r '.programs[] | "| \(.program) | `\(.elf_sha256)` | `\(.vkey)` |"' guest-manifest.json
          } > notes.md
          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: guest-manifest.json
          fail_on_unmatched_files: true
