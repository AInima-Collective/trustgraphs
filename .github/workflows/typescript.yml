name: TypeScript

on:
  pull_request:

jobs:
  typecheck:
    name: Version lock and workspace typechecks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript version and every workspace
        run: pnpm typecheck:all

      - name: Frontend lint
        run: pnpm --dir packages/frontend lint

      - name: Frontend domain and release regression tests
        run: pnpm --dir packages/frontend test

      - name: Public deployment manifest regression tests
        run: pnpm test:deploy
