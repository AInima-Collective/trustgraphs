name: TypeScript

on:
  pull_request:

jobs:
  typecheck:
    name: Version lock and workspace typechecks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.18.3

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript version and every workspace
        run: pnpm typecheck:all
