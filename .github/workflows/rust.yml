name: Rust

on:
  pull_request:
  workflow_call:

jobs:
  tests-stable:
    name: Tests (Stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - uses: actions/setup-node@v4
        name: Install Node.js
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: cargo test
        run: cargo test --locked --workspace --all-features

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rust-docs

      - uses: actions/setup-node@v4
        name: Install Node.js
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - uses: Swatinem/rust-cache@v2

      - name: doc
        run: cargo doc --locked --workspace --all-features --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: '-D warnings'

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: fmt --check
        run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: clippy
        # These lints are intentionally allowed: three preserve compatibility or byte stability
        # for pinned guest code, and the envelope verifier exposes each signed field explicitly.
        run: >-
          cargo clippy --locked --workspace --tests --all-features -- -D warnings
          -A clippy::manual-is-multiple-of
          -A clippy::map-or-identity
          -A clippy::chunks-exact-to-as-chunks
          -A clippy::too-many-arguments
