name: ZK Parity

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'crates/**'
      - 'zk/**'
      - 'tests/golden/**'
      - 'contracts/test/unit/golden/**'
      - 'packages/frontend/lib/pagerank/**'
      - 'packages/frontend/lib/hypercerts/**'
      - 'packages/frontend/lib/contributions/**'
      - 'research/composition/**'
      - 'contracts/src/params/TrustCompose*.sol'
      - 'contracts/test/unit/TrustCompose*.sol'
      - 'taskfile/zk.yml'
      - '.github/workflows/zk-parity.yml'

jobs:
  guest-elfs:
    name: Build pinned SP1 guest ELFs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            zk/program -> target
            zk/trust-graph-program -> target
            zk/weighted-program -> target
            zk/composition-program -> target
            zk/nostr-program -> target

      - name: Install SP1 toolchain (pinned 6.3.1)
        run: |
          curl -L https://sp1up.succinct.xyz | bash
          ~/.sp1/bin/sp1up --version v6.3.1
          echo "$HOME/.sp1/bin" >> "$GITHUB_PATH"

      - name: Build all isolated guest families
        run: |
          set -eu
          sh scripts/build-guests.sh
          # The ELF FILES, at the paths cargo actually put them — not the directories holding
          # them, which are ~800 MB of build state around 4.7 MB of artifact, downloaded again by
          # every job that needs the guests. The paths are derived rather than guessed, because
          # the obvious guess is wrong for the nostr guest (see scripts/guest-elf-dirs.sh).
          sh scripts/guest-elf-dirs.sh --files | tee guest-elfs.txt
          tar -czf sp1-guest-elfs.tar.gz -T guest-elfs.txt
          ls -lh sp1-guest-elfs.tar.gz

      - name: Upload guest ELFs
        uses: actions/upload-artifact@v4
        with:
          name: sp1-guest-elfs
          path: sp1-guest-elfs.tar.gz
          retention-days: 1

  parity:
    name: Parity (${{ matrix.program }})
    needs: guest-elfs
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        program:
          [
            trust-graph,
            trust-graph-weighted,
            trust-compose,
            signer,
            hypercerts,
            contributions,
            nostr-workspace,
          ]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - uses: actions/setup-node@v4
        name: Install Node.js
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10.18.3

      - name: Install Task
        uses: go-task/setup-task@v1

      - name: Install dependencies
        run: pnpm install

      - name: Download pinned guest ELFs
        uses: actions/download-artifact@v4
        with:
          name: sp1-guest-elfs

      - name: Restore guest ELF paths
        run: tar -xzf sp1-guest-elfs.tar.gz

      - name: ZK parity (${{ matrix.program }})
        run: task --yes zk:parity PROGRAM=${{ matrix.program }}

  host-lint:
    name: Host lint + tests (prover, operator)
    needs: guest-elfs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.3"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            zk/prover -> target
            zk/operator -> target

      - name: Download pinned guest ELFs
        uses: actions/download-artifact@v4
        with:
          name: sp1-guest-elfs

      - name: Restore guest ELF paths
        run: tar -xzf sp1-guest-elfs.tar.gz

      # zk/prover and zk/operator are detached workspaces: the root workspace's
      # clippy/fmt/test jobs never compile them, so they get their own pass here,
      # against the same pinned guest ELFs the parity jobs use.
      - name: clippy (prover)
        run: cargo clippy --manifest-path zk/prover/Cargo.toml --all-targets -- -D warnings
        env:
          SP1_SKIP_PROGRAM_BUILD: "true"

      - name: clippy (operator)
        run: cargo clippy --manifest-path zk/operator/Cargo.toml --all-targets -- -D warnings
        env:
          SP1_SKIP_PROGRAM_BUILD: "true"

      - name: fmt --check (prover + operator)
        run: |
          cargo fmt --manifest-path zk/prover/Cargo.toml --all --check
          cargo fmt --manifest-path zk/operator/Cargo.toml --all --check

      - name: cargo test (operator)
        run: cargo test --manifest-path zk/operator/Cargo.toml
        env:
          SP1_SKIP_PROGRAM_BUILD: "true"
