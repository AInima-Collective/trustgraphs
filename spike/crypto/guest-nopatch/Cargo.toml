[package]
name = "spike-crypto-guest-nopatch"
version = "0.1.0"
edition = "2021"

# UNPATCHED comparison build. Same source files as ../guest, but NO [patch.crates-io] section, so
# k256/sha2 compile as pure-Rust RISC-V (no SP1 precompiles). Only the two bins the task requires a
# patched-vs-unpatched delta for (ecrecover, sha256-64KiB) are built here. Bin names are suffixed
# `-nopatch` so they don't collide with the patched crate's SP1_ELF_* env vars in the host.

[[bin]]
name = "bench-ecrecover-nopatch"
path = "../guest/src/bin/bench_ecrecover.rs"

[[bin]]
name = "bench-sha256-nopatch"
path = "../guest/src/bin/bench_sha256.rs"

[dependencies]
sp1-zkvm = "=6.3.1"
k256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"

[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
