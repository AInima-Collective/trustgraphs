[package]
name = "spike-crypto-host"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "spike-crypto-host"
path = "src/main.rs"

[dependencies]
sp1-sdk = { version = "=6.3.1", features = ["blocking"] }
# Native (unpatched) crypto to generate test vectors on the host.
k256 = { version = "0.13", features = ["ecdsa"] }
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
rand = "0.8"
serde = "1"
anyhow = "1"

[build-dependencies]
sp1-build = "=6.3.1"

# Detached from the root workspace: sp1-sdk brings its own large dependency graph.
[workspace]
