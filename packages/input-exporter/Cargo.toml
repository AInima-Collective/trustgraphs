[package]
name = "input-exporter"
default-run = "input-exporter"
description = "Reconstruct a GuestInput/SignerInput (input.json) from on-chain accumulator + EAS state for a checkpoint"
edition.workspace = true
version.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "input-exporter"
path = "src/main.rs"

[lib]
crate-type = ["rlib"]

[[bin]]
name = "envelope0-gen"
path = "src/bin/envelope0_gen.rs"

[[bin]]
name = "instance-scan"
path = "src/bin/instance_scan.rs"

[dependencies]
pagerank-core = { path = "../pagerank-core" }
contributions-core = { path = "../contributions-core" }
weighted-prior-core = { path = "../weighted-prior-core" }
envelopes_crate = { path = "../envelopes", package = "envelopes" }
zk-core = { path = "../zk-core" }
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-sol-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
tokio = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
# nothing extra — the reconstruction core is tested with synthetic data (no RPC)

[lints.clippy]
unnecessary_cast = "allow"
