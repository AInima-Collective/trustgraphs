# Production operator policy for the public Ethereum mainnet app.
# Release image v0.1.5 (release run 34897235238, commit 40e945d): the config loader binds the
# manifest to chain_id and pins every embedded guest; the guests and vkeys are the v0.1.1 program
# table, unchanged, and mainnet.json records them. v0.1.4 added the lagging-node RPC hardening
# (a null receipt or block is retried, then a read failure); v0.1.5 reconciles the registry scan
# against the on-chain directory so an empty eth_getLogs answer cannot hide an instance.
# ghcr.io/ainima-collective/trustgraphs-operator@sha256:43d04f3a21e56764bf2df14928e60c5fbef550d9ae1b70ddcc01644d030c6570
#
# Endpoint credentials stay outside this tracked file. `env:NAME` references are resolved by the
# operator at startup and never enter its public status response. The transaction and Succinct
# credentials are separately supplied as SUBMITTER_PRIVATE_KEY and NETWORK_PRIVATE_KEY.
rpc = "env:RPC_URL"
# Resolved relative to this file. The loader binds the manifest to chain_id below: a record whose
# chainId is not 1 or whose chain is not "mainnet" is refused, so a copied testnet manifest cannot
# start this daemon.
release_manifest = "mainnet.json"
chain_id = 1
rpc_timeout_seconds = 30

[curated]
# Fail closed until the browser-created showcase network is recorded in mainnet.json, then fund
# exactly that one tracked instance. Additional permissionless instances must use the vault.
single_release_instance = true

[paid]
enabled = true
# The vault address is read from the finalized release manifest and checked for conflicts.
# The public address of the separately funded mainnet submitter key (SUBMITTER_PRIVATE_KEY).
recipient = "0xcCb147031FdE4e30dD55C583c0ab3Eff7ff64882"

[cadence]
tick_seconds = 60
# The mainnet factory epoch floor is 1 block (decision D2 in research/operations/mainnet.md), so
# this and [budget] are the only limits on subsidized proving of the curated instance. 50 blocks is
# about ten minutes between proofs while the graph is changing (lowered from 300 on 2026-09-15, the
# Sepolia value); the daily budget below caps what that can spend. Quiet graphs cost nothing.
subsidy_min_blocks = 50
max_concurrent = 1
max_per_instance = 1

[gas]
# Proofs wait out a fee spike rather than buying a submit at the top of one.
max_basefee_gwei = 30
priority_fee_gwei = 0.1
replacement_after_s = 300
simulate_before_send = true

[finality]
# About 2.5 minutes. Post-merge mainnet reorgs deeper than a block or two are rare, and the cost of
# one is a wasted proof, never a wrong root: a reorged submit re-plans from the held proof. Lowered
# from 64 (full finality) on 2026-09-15 so a root follows its checkpoint within minutes.
confirmations = 12
track_block_hash = true

[prover]
backend = "network"
groth16 = true
timeout_s = 3600

[budget]
# The showcase's first mainnet submitProof (2026-09-15) used 1,156,918 gas at 1.76 gwei during a
# base-fee spike: 0.00204 ETH, about $5, which alone exhausted the original $5 per-instance cap and
# held the network for a rolling day. Later submits are cheaper (warm slots). Succinct cycles are
# priced through cents_per_billion_cycles; eth_usd books on-chain gas burn into the same ledger
# (Chainlink ETH/USD read $2,396 on 2026-09-15). The window is rolling and rebuilt from the journal,
# so a restart does not reset spend.
per_instance_usd_per_day = 25
global_usd_per_day = 50
global_alert_percent = 80
window_seconds = 86400
cents_per_billion_cycles = 100
eth_usd = 2400

[signer_sync]
enabled = true
confirmations = 64
track_block_hash = true
per_instance_usd_per_day = 2
global_usd_per_day = 5
budget_window_seconds = 86400

[ipfs]
# One genuinely independent writable service today, Pinata. Counting the same account or gateway
# twice would invent durability. A second independently writable and readable target (decision D5
# in research/operations/mainnet.md, still open) is added as another [[ipfs.targets]] entry and
# raises min_success to 2.
min_success = 1
retry_seconds = 300

[[ipfs.targets]]
name = "pinata"
kind = "pinata"
api = "env:IPFS_PIN_API"
gateway = "env:IPFS_GATEWAY"
token_env = "IPFS_PIN_API_KEY"

[ops]
state_dir = "/data"
journal_path = "/data/journal.jsonl"
status_path = "/data/status.json"
# Railway private networking is dual-stack for new environments and IPv6-only for legacy ones.
# Binding the unspecified IPv6 address is dual-stack on Linux, so either network generation and
# Docker's existing IPv4 localhost health check work with the same profile.
listen = "[::]:8080"
ready_after_seconds = 10800
tool_timeout_seconds = 900
log_format = "json"
submit_failure_threshold = 3
# Resolved at startup like the endpoints above; the daemon refuses to start without the variable.
alert_webhook = "env:OPERATOR_ALERT_WEBHOOK"
