[package]
name = "trustgraphs-nostr-sp1-bench-host"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
hex = "0.4"
k256 = { version = "0.13", features = ["schnorr"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sp1-sdk = { version = "=6.3.1", features = ["blocking"] }

[build-dependencies]
sp1-build = "=6.3.1"

[workspace]
