[package]
name = "trustgraphs-nostr-sp1-bench-guest"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "nostr-bench-schnorr"
path = "../../bench_schnorr.rs"

[[bin]]
name = "nostr-bench-event"
path = "../../bench_nostr_event.rs"

[[bin]]
name = "nostr-bench-audit"
path = "../../bench_audit.rs"

[[bin]]
name = "nostr-bench-oa"
path = "../../bench_oa.rs"

[[bin]]
name = "nostr-bench-envelope"
path = "../../bench_envelope.rs"

[dependencies]
k256 = { version = "0.13", features = ["schnorr"] }
sha2 = "0.10"
sp1-zkvm = "=6.3.1"

[workspace]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.0.0" }
k256 = { git = "https://github.com/sp1-patches/elliptic-curves", package = "k256", tag = "patch-k256-13.4-sp1-6.0.0" }
