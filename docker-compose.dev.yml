###################################
#
# task start-all-local
#
###################################

# docker volume rm $(docker volume ls -q -f "dangling=true")

services:
  ipfs:
    image: ipfs/kubo:v0.37.0
    network_mode: host
    ports:
      - '4001:4001'
      - '4001:4001/udp'
      - '8080:8080'
      - '5001:5001'
    stop_signal: SIGKILL
    command: daemon
    restart: unless-stopped

  ponder-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ponder
      POSTGRES_USER: ponder
      POSTGRES_PASSWORD: ponder
    volumes:
      - ponder-db-data:/var/lib/postgresql/data
    ports:
      - '6432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -d ponder -U ponder']
      interval: 1s
      timeout: 3s
      retries: 5

volumes:
  ponder-db-data:
