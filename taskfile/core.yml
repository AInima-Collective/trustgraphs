version: "3"

silent: true

tasks:
  clean:
    desc: "Clean up project files"
    cmds:
      - forge clean
      - cargo clean
      - rm -rf cache out broadcast

  test:
    desc: "Run forge test"
    cmds:
      - forge test

  e2e:
    desc: "End-to-end: deploy on a local chain, attest, checkpoint, export input.json, cross-check the guest (needs anvil + SP1 toolchain)"
    cmds:
      - bash tests/e2e/run.sh

  fmt:
    desc: "Format Solidity and Rust code"
    cmds:
      - forge fmt
      - cargo fmt

  setup-env:
    desc: "Create .env file from example if it doesn't exist"
    cmds:
      - |
        if [ ! -f .env ]; then
          if [ -f .env.example ]; then
            echo "Creating .env file from .env.example..."
            cp .env.example .env
            echo ".env file created successfully!"
          fi
        fi

  check-requirements:
    desc: "Verify system requirements are installed"
    cmds:
      - |
        echo "🔍 Validating system requirements..."
        # Check Node.js
        if ! command -v node >/dev/null 2>&1; then
          echo "❌ Node.js not found. Install with: curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.3/install.sh | bash && nvm install --lts"
          exit 1
        fi
        NODE_VERSION=$(node --version)
        MAJOR_VERSION=$(echo $NODE_VERSION | sed 's/^v\([0-9]*\)\..*/\1/')
        if [ $MAJOR_VERSION -lt 21 ]; then
          echo "❌ Node.js version $NODE_VERSION is less than required v21"
          echo "💡 Upgrade with: nvm install --lts"
          exit 1
        fi
        # Check jq
        if ! command -v jq >/dev/null 2>&1; then
          echo "❌ jq not found. Install with: brew install jq (macOS) or apt install jq (Linux)"
          exit 1
        fi
        # Check cargo
        if ! command -v cargo >/dev/null 2>&1; then
          echo "❌ cargo not found. Install with: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh"
          exit 1
        fi
        # Check the SP1 toolchain — the guests can't be built without it, and every proving
        # path in the repo needs the guests. See docs/build/setup.md.
        if ! command -v cargo-prove >/dev/null 2>&1; then
          echo "❌ cargo-prove not found. Install with: curl -L https://sp1up.succinct.xyz | bash && ~/.sp1/bin/sp1up --version v6.3.1"
          echo "💡 then add it to PATH: export PATH=\"\$HOME/.sp1/bin:\$PATH\""
          exit 1
        fi
        # Derived, not globbed: reproducible builds land one directory deeper than the plain
        # ones, and one guest's target directory belongs to the workspace above it.
        if ! sh scripts/guest-elf-dirs.sh --files 2>/dev/null | grep -q "/trustgraph-program-v2$"; then
          echo "⚠️  SP1 guest ELFs not built yet. Run: task zk:build"
        fi
        # Check docker
        if ! command -v docker >/dev/null 2>&1; then
          echo "❌ docker not found. Visit: https://docs.docker.com/get-docker/"
          exit 1
        fi
        echo "✅ All requirements satisfied"

  dos2unix:
    desc: "Convert all script files to Unix line endings"
    cmds:
      - |
        find contracts/script/ -type f -name "*.sh" -exec dos2unix {} \;
        find contracts/script/ -type f -name "*.env*" -exec dos2unix {} \;
