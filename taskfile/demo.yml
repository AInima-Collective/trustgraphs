# The demo, as tasks. Prose walkthrough: docs/build/quickstart.md
#
# `task demo` is the finite walkthrough: deploy one complete funded network, seed its real graph
# and a contribution round over that same graph, let one-shot proof-scheduler ticks land both roots
# (the trust root paid through the vault, the round on the curated tier), then fund the round and
# pay the contributors. It exits after the seeded roots land. `task demo:live` runs that walkthrough
# and then keeps the scheduler in the foreground so later attestations produce later roots. Every
# step is also its own task, because the interesting part of a demo is usually re-running one piece.
#
# What this does NOT do is start anvil, Postgres or IPFS — `task start-all-local` owns those, and
# owning them from here would mean tearing them down when the demo ends.
version: '3'

vars:
  RPC: '{{.RPC | default "http://127.0.0.1:8545"}}'
  # The seeded network the complete demo operates. `demo:create` can still create an additional
  # runtime network by passing a different NAME (the walkthrough uses "Bakers Guild").
  NAME: '{{.NAME | default "Demo Co-op"}}'
  # Anvil account 0. Both the seeded Demo Co-op and networks made by `demo:create` are rooted here.
  # `seed-graph.sh` signs with anvil's well-known keys, so a seed outside 0-9 gives a graph the seed
  # cannot reach and every score flattens to the same floor.
  SEED_ACCOUNT: '{{.SEED_ACCOUNT | default "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"}}'
  PREPAY_WEI: '{{.PREPAY_WEI | default "2000000000000000000"}}'
  # Pay for every root, at most $50 of it.
  MAX_PER_ROOT_USD: '{{.MAX_PER_ROOT_USD | default "5000000000"}}'
  # Enough ticks for two instances. The trust root typically lands on tick 3; the round's first
  # trigger also waits out the contributions epoch (10 dev blocks, 8 mined per tick), so it lands
  # a few ticks behind.
  TICKS: '{{.TICKS | default "10"}}'
  # What `payout` funds the round with, in pool-token base units (tUSDC, 6 dp). The round's guest
  # scores against the params' 5e9 pool, so funding the same 5e9 pays each contributor their
  # merkle value × 0.97 (the distributor's 3% fee).
  FUND_AMOUNT: '{{.FUND_AMOUNT | default "5000000000"}}'
  # 2 x Ponder's finality default for an unrecognised chain id (30), plus margin. See `settle`.
  SETTLE_BLOCKS: '{{.SETTLE_BLOCKS | default "64"}}'
  # Where the indexer serves, so `report` can say whether the app will actually see any of this.
  PONDER: '{{.PONDER | default "http://127.0.0.1:65421"}}'
  IPFS_API: '{{.IPFS_API | default "http://127.0.0.1:5001"}}'
  # The reader's view, and the exact string the indexer uses (packages/indexer/.env IPFS_GATEWAY). Keep the
  # trailing `/ipfs/`: both sides build the URL by plain concatenation.
  IPFS_GATEWAY: '{{.IPFS_GATEWAY | default "http://127.0.0.1:8080/ipfs/"}}'
  # The operator's read-only health listener. `/health`, `/ready`, and the sanitized heartbeat
  # the frontend reads through OPERATOR_STATUS_URL.
  OPERATOR_PORT: '{{.OPERATOR_PORT | default "8799"}}'
  WORK: .demo

tasks:
  default:
    desc: 'Finite demo: deploy one funded Demo Co-op, seed graph + contribution round, prove both, pay out'
    cmds:
      # `clean` FIRST, because this task deploys a fresh stack and the journal from the last one
      # would block it. An instance id is keccak(creator, name, salt) and a restarted anvil counts
      # checkpoints from 0 again, so every field of the request journal's key repeats — the journal
      # then refuses the new chain's work as already-paid-for. Correct of it, and fatal here.
      - task: clean
      - task: preflight
      - task: deploy
      - task: seed
      # BEFORE the daemon exists (`prove` writes its config): the round must have content when the
      # daemon's first trigger freezes checkpoint 0, for the same reason the graph is seeded before
      # the first trust trigger — a checkpoint frozen over an empty round is immutable and proves
      # to a zero-payout root.
      - task: seed-round
      # Report whatever happened, including when `prove` fails. A demo that lands nothing and says
      # nothing is worse than one that fails.
      - defer: { task: report }
      - task: prove
      - task: settle
      # After `settle` on purpose: fund and claim both read the round from the indexer, and the
      # indexer serves the landed root only once it is past Ponder's finality window. Skips itself
      # when no indexer is running — the roots are still proven and landed either way.
      - task: payout

  live:
    desc: 'Deploy the full demo, then keep the proof scheduler in the foreground for new attestations'
    cmds:
      - task: default
      - task: operator

  preflight:
    desc: 'Refuse to start rather than fail halfway'
    cmds:
      - |
        fail() { echo "✗ $1" >&2; exit 1; }
        command -v anvil  >/dev/null || fail "anvil not found (foundryup)"
        command -v jq     >/dev/null || fail "jq not found"
        command -v cargo  >/dev/null || fail "cargo not found"
        command -v curl   >/dev/null || fail "curl not found"

        # Every step below runs the prover host with SP1_SKIP_PROGRAM_BUILD=true, so the guest
        # ELFs must already exist — nothing in this taskfile builds them. Without this check the
        # first failure is a missing-file error from `include_elf!` in the middle of a Rust build,
        # several minutes in, which reads like a broken checkout instead of a missing step.
        # Globbed on the target triple on purpose: SP1 moved it from riscv32im to riscv64im.
        ls zk/program/target/elf-compilation/*/release/trustgraph-signer-program \
           zk/trustgraph-program-v2/target/elf-compilation/*/release/trustgraph-program-v2 \
           zk/weighted-program/target/elf-compilation/*/release/trustgraph-weighted-program \
           zk/composition-program/target/elf-compilation/*/release/trustgraph-compose-program \
           zk/nostr-program/program/target/elf-compilation/*/release/nostr-workspace \
           >/dev/null 2>&1 \
          || fail "the SP1 guest ELFs are not built — run: task zk:build"

        cast block-number --rpc-url {{.RPC}} >/dev/null 2>&1 \
          || fail "no chain at {{.RPC}} — start one: anvil --silent &"
        [ -n "${FUNDED_KEY:-}" ] || fail "FUNDED_KEY unset (it comes from .env)"

        # Proof submission is deliberately blocked until the score blob is both pinned and
        # readable through the same gateway the indexer uses. `start-all-local` starts kubo in
        # parallel with anvil, so merely seeing the chain is not evidence that IPFS is ready yet.
        # Pin a stable tiny probe (same CID every run), then fetch it through the reader path.
        IPFS_PROBE=trustgraphs-demo-preflight-v1
        IPFS_RESULT=$(printf '%s' "$IPFS_PROBE" \
          | curl -fsS -m 10 -X POST -F 'file=@-;filename=trustgraphs-demo-preflight.txt' \
              '{{.IPFS_API}}/api/v0/add?cid-version=1&raw-leaves=true&pin=true') \
          || fail "IPFS API is not ready at {{.IPFS_API}} — start: task start-all-local"
        IPFS_CID=$(printf '%s' "$IPFS_RESULT" | jq -r '.Hash // empty')
        [ -n "$IPFS_CID" ] || fail "IPFS API returned no CID at {{.IPFS_API}}"
        IPFS_READBACK=$(curl -fsS -m 10 "{{.IPFS_GATEWAY}}$IPFS_CID") \
          || fail "IPFS gateway cannot read the API's probe at {{.IPFS_GATEWAY}}$IPFS_CID"
        [ "$IPFS_READBACK" = "$IPFS_PROBE" ] \
          || fail "IPFS API/gateway probe bytes differ — they must address the same pinned content"

        # FUNDED_KEY is not an anvil default, so on a fresh chain it has nothing and the first
        # deploy step dies with `Insufficient funds`. Top it up rather than explaining it.
        DEPLOYER=$(cast wallet address --private-key "$FUNDED_KEY")
        BAL=$(cast balance "$DEPLOYER" --rpc-url {{.RPC}})
        if [ "$BAL" = "0" ]; then
          echo "→ funding the deployer $DEPLOYER"
          cast send "$DEPLOYER" --value 1000ether --rpc-url {{.RPC}} \
            --private-key 0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80 >/dev/null
        fi
        echo "✓ chain {{.RPC}}, deployer $DEPLOYER funded"

  vkeys:
    desc: 'Print the guest vkeys this checkout produces (deploy pins them immutably)'
    cmds:
      - |
        cd zk/prover
        for p in trust-graph trust-graph-weighted trust-compose signer hypercerts contributions; do
          printf '%-21s %s\n' "$p" "$(SP1_PROVER=mock SP1_SKIP_PROGRAM_BUILD=true cargo run -q --release -- $p vkey)"
        done

  deploy:
    desc: "Deploy the stack and complete Demo Co-op, with verifiers pinned to THIS checkout's guests"
    cmds:
      - |
        # The one ordering that silently ruins a demo: SP1JournalVerifier pins its vkey at
        # construction and never again, so deploying against a stale .env value gives a stack that
        # looks healthy and then refuses to prove anything (`hold: verifier_rotated`). Derive them
        # here rather than trusting the file.
        cd zk/prover
        export SP1_PROGRAM_VKEY=$(SP1_PROVER=mock SP1_SKIP_PROGRAM_BUILD=true cargo run -q --release -- trust-graph vkey)
        export SP1_SIGNER_PROGRAM_VKEY=$(SP1_PROVER=mock SP1_SKIP_PROGRAM_BUILD=true cargo run -q --release -- signer vkey)
        export CONTRIBUTIONS_PROGRAM_VKEY=$(SP1_PROVER=mock SP1_SKIP_PROGRAM_BUILD=true cargo run -q --release -- contributions vkey)
        # The weighted and compose factory steps fail closed without their own program's vkey
        # (DeployZkVerifier's zero-vkey fallback is the ROOT vkey, which would pin the wrong guest).
        export SP1_WEIGHTED_PROGRAM_VKEY=$(SP1_PROVER=mock SP1_SKIP_PROGRAM_BUILD=true cargo run -q --release -- trust-graph-weighted vkey)
        export SP1_COMPOSITION_PROGRAM_VKEY=$(SP1_PROVER=mock SP1_SKIP_PROGRAM_BUILD=true cargo run -q --release -- trust-compose vkey)
        cd ../..
        # Give the one seeded network the same reachable anvil seed as `demo:create`. Use demo-local
        # params so the deploy never mutates a developer's params.json.
        mkdir -p {{.WORK}}
        jq --arg seed '{{.SEED_ACCOUNT}}' '
          .trusted_seeds = [$seed]
          | .schema_uid = ("0x" + ("0" * 64))
          | .accumulator = "0x0000000000000000000000000000000000000000"
          | .chain_id = 0
        ' tests/e2e/params.template.json > {{.WORK}}/params.json
        echo "→ deploying against trust-graph vkey $SP1_PROGRAM_VKEY"
        PARAMS_JSON={{.WORK}}/params.json \
          DEV_SEED_PREPAY_WEI={{.PREPAY_WEI}} \
          DEV_SEED_MAX_PER_ROOT_USD={{.MAX_PER_ROOT_USD}} \
          pnpm deploy:contracts
      - task: addresses
      - |
        # The indexer reads .docker/deployment_summary.json ONCE, at startup (ponder.config.ts
        # imports it), so a redeploy's new addresses — including the weighted and compose factory
        # sources — are invisible to an indexer that is already running.
        echo "→ if the indexer was already running, restart it (pnpm indexer start):"
        echo "  it reads .docker/deployment_summary.json only at startup"

  fund:
    desc: "Top up Demo Co-op's proving tank after deployment"
    cmds:
      - |
        VAULT=$(jq -r .proving_vault .docker/proving_vault_deploy.json)
        ID=$(task --silent demo:id NAME='{{.NAME}}')
        cast send "$VAULT" 'depositETH(bytes32)' "$ID" --value {{.PREPAY_WEI}} \
          --rpc-url {{.RPC}} --private-key "$FUNDED_KEY" >/dev/null
        echo "✓ topped up {{.NAME}}"
        echo "  id     $ID"
        echo "  tank   $(cast call "$VAULT" 'accountOf(bytes32)((address,bytes32,uint128,uint128))' "$ID" --rpc-url {{.RPC}})"

  addresses:
    desc: 'Print every address the demo uses, read from chain and deploy artifacts'
    cmds:
      - |
        R={{.RPC}}
        VAULT=$(jq -r .proving_vault     .docker/proving_vault_deploy.json)
        FAC=$(jq   -r .factory           .docker/factory_deploy.json)
        REG=$(jq   -r .instance_registry .docker/instance_registry_deploy.json)
        printf '  %-12s %s\n' factory "$FAC" registry "$REG" vault "$VAULT"
        printf '  %-12s %s\n' 'fee band 1' \
          "$(cast call $VAULT 'feePerRootUsd(bytes32,uint8)(uint256)' $(cast keccak "trust-graph") 1 --rpc-url $R)"
        [ "$(cast call $FAC 'VAULT()(address)' --rpc-url $R)" = "$VAULT" ] \
          && echo "  ✓ the factory's prepay path points at that vault" \
          || echo "  ✗ factory VAULT() does not match — createInstance will reject any prepay"

  create:
    desc: 'Create and fund an additional runtime network (pass a NAME other than Demo Co-op)'
    cmds:
      - |
        [ '{{.NAME}}' != 'Demo Co-op' ] || {
          echo "fatal: Demo Co-op is already deployed; pass NAME='Bakers Guild' (or another name)" >&2
          exit 1
        }
        FAC=$(jq -r .factory .docker/factory_deploy.json)
        forge script contracts/script/examples/CreateInstance.s.sol:CreateInstance \
          --sig 'run(address,uint256,string,address)' \
          "$FAC" {{.PREPAY_WEI}} '{{.NAME}}' {{.SEED_ACCOUNT}} \
          --rpc-url {{.RPC}} --private-key "$FUNDED_KEY" --broadcast --skip-simulation >/dev/null
      - |
        # The community's own limit. Only it can set this: EPOCH_FLOOR binds at creation, but
        # setEpochLength is constitutional, so the paid cadence has to live in the vault.
        VAULT=$(jq -r .proving_vault .docker/proving_vault_deploy.json)
        ID=$(task --silent demo:id NAME='{{.NAME}}')
        cast send "$VAULT" 'setPolicy(bytes32,uint64,uint96)' "$ID" 0 {{.MAX_PER_ROOT_USD}} \
          --rpc-url {{.RPC}} --private-key "$FUNDED_KEY" >/dev/null
        echo "✓ created {{.NAME}}"
        echo "  id     $ID"
        echo "  tank   $(cast call "$VAULT" 'accountOf(bytes32)((address,bytes32,uint128,uint128))' "$ID" --rpc-url {{.RPC}})"

  id:
    desc: 'The instance id, resolved from the factory event (no scratch files)'
    cmds:
      - |
        FAC=$(jq -r .factory .docker/factory_deploy.json)
        bash -c '
          set -euo pipefail
          . taskfile/lib/instance.sh
          resolve_instance "$1" "$2" "$3"
          printf "%s\n" "$INSTANCE_ID"
        ' _ '{{.NAME}}' "$FAC" '{{.RPC}}'

  seed:
    desc: "Vouch: 21 edges over 14 accounts, rooted at the instance's trusted seed"
    cmds:
      - |
        # BEFORE the first trigger, always. A checkpoint frozen over an empty graph proves to a
        # zero root, the gov hook rejects it, and its contents are immutable — see issue #15.
        PK="$FUNDED_KEY" RPC={{.RPC}} bash taskfile/seed-graph.sh '{{.NAME}}'

  seed-round:
    desc: 'Seed the 6-persona contribution round over the demo graph (claims, responses, valuations)'
    cmds:
      - |
        # The round driver is frontend code (SchemaManager → EAS.attest), and while its SCHEMA
        # uids flow live from config/networks.development.json (rewritten every deploy), its
        # contract ADDRESSES are wagmi-generated into packages/frontend/lib/contracts.ts — which nothing
        # else in `task demo` touches; normally the frontend dev server's predev regenerates it.
        # Left stale, the driver sends a current schema uid to a previous deploy's EAS and the
        # first vouch dies as a bare revert. Regenerate in predev's order: config, symlink, ABIs.
        #
        # `pnpm frontend …` (the root script) and NOT `pnpm --filter frontend …`: --filter
        # matches package NAMES, the package is named trustgraphs-frontend, and pnpm treats a
        # filter that matches nothing as success — it prints "No projects matched" and exits 0,
        # which is how this step once no-opped its way into that bare revert.
        pnpm frontend config:generate
        pnpm frontend config:link
        pnpm frontend wagmi:generate
      - |
        # Codegen that silently didn't happen looks identical to codegen that worked, so check
        # the one value the driver cannot survive being stale: the generated EAS address must be
        # the EAS this deploy just wrote. Catches the no-op filter above, a half-run predev, and
        # a redeploy on a reused chain (shifted nonces move every address) alike.
        WANT=$(jq -r .eas .docker/eas_deploy.json | tr 'A-F' 'a-f')
        GEN=$(grep -oE "easAddress = '0x[0-9a-fA-F]{40}'" packages/frontend/lib/contracts.ts | grep -oE '0x[0-9a-fA-F]{40}' | tr 'A-F' 'a-f')
        if [ -z "$GEN" ] || [ "$GEN" != "$WANT" ]; then
          echo "✗ frontend codegen is not tracking this deploy:" >&2
          echo "    generated easAddress  ${GEN:-<none>}" >&2
          echo "    deployed EAS          $WANT" >&2
          echo "  re-run: pnpm frontend config:generate && pnpm frontend config:link && pnpm frontend wagmi:generate" >&2
          exit 1
        fi
      - |
        # The whole M5 worked example, driven through the frontend's exact attest seams: the
        # fixture's six vouches, an out-of-window claim, the round window (paramsHash rotation),
        # then the in-window claims, responses and valuations.
        #
        # Those six vouches land ON TOP of the 21 edges `seed` just planted — same trust
        # accumulator, mirrored into the round at its checkpoint. That composition is the point:
        # rater reputation comes from the community's real graph, not a lab fixture. It is also
        # why the payout numbers differ from research/operations/contributions/local-testing.md, whose wei-exact
        # expectations assume the fixture graph alone.
        task contributions:create-contribution-round-network

  govern:
    desc: 'Give the demo network a Safe, a gov module and a UI entry for them'
    cmds:
      - |
        # Raw factory instances have no governance module. This bolts the Zodiac stack on and, in
        # the same broadcast, hands the typed params controller to the new Safe. The regular demo
        # deploy already does this; this task is for instances created later via `demo:create`.
        SNAP=$(task --silent demo:snapshot NAME='{{.NAME}}')
        ID=$(task --silent demo:id NAME='{{.NAME}}')
        REG=$(jq -r .instance_registry .docker/factory_deploy.json)
        CONTROLLER=$(cast call "$REG" 'paramsAuthority(bytes32)(address)' "$ID" --rpc-url {{.RPC}})
        SIGNER_VERIFIER=$(jq -r '.signer_zk_verifier // .zk_verifier' \
          .docker/signer_zk_verifier_deploy.json 2>/dev/null \
          || jq -r .zk_verifier .docker/zk_verifier_deploy.json)
        forge script contracts/script/DeployZodiacSafes.s.sol:DeployZodiacSafes \
          --sig 'run(string,string,string)' "$SNAP" "$SIGNER_VERIFIER" "$CONTROLLER" \
          --rpc-url {{.RPC}} --private-key "$FUNDED_KEY" --broadcast --slow >/dev/null
        SAFE=$(jq -r .safe.address .docker/zodiac_safes_deploy.json)
        FAC=$(jq -r .factory .docker/factory_deploy.json)
        forge script contracts/script/AttachDevDistributor.s.sol:AttachDevDistributor \
          --sig 'run(string,string,string,string)' "$FAC" "$SNAP" "$SAFE" '' \
          --rpc-url {{.RPC}} --private-key "$FUNDED_KEY" --broadcast --slow >/dev/null
      - |
        # A module added after raw factory creation has no governed-factory discovery event. Add it
        # to the local seed as well, matched on the snapshot the demo just created. Networks made
        # in the browser use GovernedTrustgraphsFactory and need no such edit.
        SNAP=$(task --silent demo:snapshot NAME='{{.NAME}}')
        RESOLVER=$(task --silent demo:resolver NAME='{{.NAME}}' 2>/dev/null || echo "")
        node -e '
          const fs = require("fs");
          const f = "config/networks.development.json";
          const nets = JSON.parse(fs.readFileSync(f, "utf8"));
          const z = JSON.parse(fs.readFileSync(".docker/zodiac_safes_deploy.json", "utf8"));
          const snap = process.argv[1], resolver = process.argv[2], name = process.argv[3];
          const id = name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
          const same = (a, b) => (a || "").toLowerCase() === (b || "").toLowerCase();
          const contracts = {
            merkleSnapshot: snap,
            ...(resolver ? { easIndexerResolver: resolver } : {}),
            merkleGovModule: z.safe.merkle_gov_module,
            safe: {
              factory: z.safe_factory,
              singleton: z.safe_singleton,
              proxy: z.safe.address,
              signerSyncManager: z.safe.signer_sync_module,
            },
          };
          const existing = nets.findIndex((n) => same(n.contracts?.merkleSnapshot, snap));
          if (existing >= 0) {
            nets[existing].contracts = { ...nets[existing].contracts, ...contracts };
          } else {
            // Presentation only — mergeInstance takes name/about/criteria from the catalog row
            // when the seed omits them, so this entry exists purely to carry the Safe.
            nets.push({ id, name, about: "", criteria: "", contracts, schemas: [],
                        pagerank: { enabled: true } });
          }
          fs.writeFileSync(f, JSON.stringify(nets, null, 2) + "\n");
          console.log("  ✓ config entry for " + name + " (" + (existing >= 0 ? "updated" : "added") + ")");
        ' "$SNAP" "$RESOLVER" '{{.NAME}}'
      - |
        # And the INDEXER's copy, which is a different file. `ponder.config.ts` builds its gov and
        # Safe sources from `.docker/deployment_summary.json`; the frontend config above is not
        # read by Ponder at all. Writing only the frontend one gives a UI that renders a
        # governance tab over a module nobody indexed, and the page then dies on
        # "Query data cannot be undefined" for `merkle_gov_module`.
        #
        # The factory-created snapshot/resolver/distributor need no entry — Ponder discovers those
        # from `InstanceCreated`. Only the bolted-on Zodiac stack does.
        SNAP=$(task --silent demo:snapshot NAME='{{.NAME}}')
        node -e '
          const fs = require("fs");
          const f = ".docker/deployment_summary.json";
          const s = JSON.parse(fs.readFileSync(f, "utf8"));
          const z = JSON.parse(fs.readFileSync(".docker/zodiac_safes_deploy.json", "utf8"));
          const snap = process.argv[1];
          const same = (a, b) => (a || "").toLowerCase() === (b || "").toLowerCase();
          s.networks = s.networks || [];
          let net = s.networks.find((n) => same(n.contracts?.merkleSnapshot, snap));
          if (!net) { net = { name: process.argv[2], contracts: { merkleSnapshot: snap } }; s.networks.push(net); }
          net.contracts = { ...net.contracts,
            merkleGovModule: z.safe.merkle_gov_module,
            safe: { ...(net.contracts.safe || {}), proxy: z.safe.address } };
          fs.writeFileSync(f, JSON.stringify(s, null, 2) + "\n");
          console.log("  ✓ indexer sources for the gov module + Safe");
        ' "$SNAP" '{{.NAME}}'
      - |
        echo "  restart the indexer AND the frontend to pick up the new sources"

  contributions:
    desc: "A contributions round over the demo network's own trust graph"
    cmds:
      - |
        # Rounds are factory-minted (one transaction by the parent network's authority; the
        # indexer discovers them from the creation event). The main deploy already mints one over
        # Demo Co-op; this task is for an additional network created with `demo:create` and then
        # given its Safe with `demo:govern`. The
        # parent is resolved on-chain — the script scans the registry for the snapshot address —
        # not from `.trustgraph/create-instance.json`: that file is last-write-wins scratch, so
        # any other `CreateInstance` run since clobbers it and this silently wires the round to a
        # DIFFERENT network's graph. It did exactly that once.
        SNAP=$(task --silent demo:snapshot NAME='{{.NAME}}')
        : "${SNAP:?no instance yet — run: task demo:create}"
        FAC=$(jq -r .contributions_factory .docker/contributions_factory_deploy.json)
        PARAMS=${CONTRIBUTIONS_PARAMS_JSON:-params.contributions.demo.json}
        [ -f "$PARAMS" ] || cp tests/e2e/params.contributions.template.json "$PARAMS"
        USDC=$(jq -r '.usdc // empty' .docker/proving_vault_deploy.json 2>/dev/null)
        SAFE=$(jq -r .safe.address .docker/zodiac_safes_deploy.json)
        forge script contracts/script/CreateDevContributionsRound.s.sol:CreateDevContributionsRound \
          --sig 'run(string,string,string,string,string,string,string)' \
          "$FAC" "$SNAP" "$PARAMS" '{{.NAME}} Contributions' "$USDC" "$SAFE" 'demo' \
          --rpc-url {{.RPC}} --private-key "$FUNDED_KEY" --broadcast --slow >/dev/null
        echo "  ✓ contributions round over {{.NAME}}'s graph"
        echo "    artifact: .docker/contributions_round_demo_deploy.json"

  config:
    desc: 'Write the operator config'
    cmds:
      - |
        mkdir -p {{.WORK}}
        REG=$(jq   -r .instance_registry .docker/instance_registry_deploy.json)
        VAULT=$(jq -r .proving_vault     .docker/proving_vault_deploy.json)
        CHAIN=$(cast chain-id --rpc-url {{.RPC}})
        : "${REG:?}" "${VAULT:?}" "${FUNDED_KEY:?}"

        # Rounds are registry-discoverable and publish their full tuple through the typed params
        # authority. Curate every factory-minted round this box deployed (the dev round from the
        # main deploy, plus any `demo:contributions` round); no manifest or params path is needed.
        CURATED=$(jq -sc '[.[] | .instance_id | select(. != null)]' \
          .docker/contributions_round_*_deploy.json 2>/dev/null || echo '[]')

        # The heredoc below is UNQUOTED on purpose: recipient is a command substitution that has
        # to run. That means BACKTICKS RUN TOO, including inside the comments being written into
        # the file — a `word` there is executed and replaced by nothing. Keep backticks and $( out
        # of the heredoc body; explain things here instead.
        cat > {{.WORK}}/operator.toml <<EOF
        rpc      = "{{.RPC}}"
        registry = "$REG"
        chain_id = $CHAIN

        # Proven on us. This list IS the free tier; there is no unconditional one.
        [curated]
        instances = $CURATED

        # Everyone else draws their own tank, and the same loop pays whoever produced the root.
        [paid]
        enabled   = true
        vault     = "$VAULT"
        recipient = "$(cast wallet address --private-key "$FUNDED_KEY")"

        [cadence]
        tick_seconds       = 2
        subsidy_min_blocks = 0

        [finality]
        confirmations = 0

        [prover]
        backend = "mock"
        groth16 = true

        # Where the score blob goes. Without this the daemon lands roots the indexer cannot read,
        # and every network page renders an empty roster over a perfectly valid proof. The gateway
        # is the SAME string the indexer reads, from IPFS_GATEWAY: the pin is verified by fetching
        # it back the way a reader would, because "the API took it" and "a reader can get it" are
        # only the same claim while both are the same node.
        [ipfs]
        min_success = 1
        # Production waits five minutes before retrying an unavailable publication target. A
        # ten-tick local walkthrough should recover on its next tick from a transient kubo miss.
        retry_seconds = 2

        [[ipfs.targets]]
        name    = "local-kubo"
        api     = "{{.IPFS_API}}"
        gateway = "{{.IPFS_GATEWAY}}"

        # One directory holds everything the daemon owns: the request journal, the heartbeat,
        # the per-checkpoint working files, and both recovery caches. "." means "beside this
        # config file", so the demo state lives in {{.WORK}} and nothing depends on which
        # directory the daemon was started from.
        [ops]
        state_dir  = "."
        log_format = "json"
        # The read-only health and heartbeat listener. The frontend already knows how to read a
        # remote heartbeat through OPERATOR_STATUS_URL, and until this existed there was nothing
        # to point it at — so that mode had never been run anywhere. Now the demo runs it.
        listen     = "127.0.0.1:{{.OPERATOR_PORT}}"
        # A one-second demo cadence would otherwise give /ready a three-second fuse.
        ready_after_seconds = 60
        EOF
        echo "✓ {{.WORK}}/operator.toml"
        echo "  heartbeat http://127.0.0.1:{{.OPERATOR_PORT}}/status (while the daemon runs)"

  dry-run:
    desc: 'Every chain read and every decision, no sends'
    deps: [config]
    cmds:
      - |
        SUBMITTER_PRIVATE_KEY="$FUNDED_KEY" SP1_SKIP_PROGRAM_BUILD=true \
        cargo run -q --release --manifest-path zk/operator/Cargo.toml -- \
          --config {{.WORK}}/operator.toml --once --dry-run 2>/dev/null \
          | jq -c 'select(.event=="decision") | {instance, action}'

  operator:
    desc: 'Keep the demo proof scheduler running in the foreground (Ctrl-C to stop)'
    deps: [config]
    cmds:
      - |
        echo "→ proof scheduler watching every eligible instance (Ctrl-C to stop)"
        echo "  status  {{.WORK}}/status.json"
        echo "  journal {{.WORK}}/journal.jsonl"
        echo "  health  http://127.0.0.1:{{.OPERATOR_PORT}}/health and /ready"
        echo ""
        echo "  To render operator status in the app from the LISTENER rather than the file,"
        echo "  start the frontend with:"
        echo "    OPERATOR_STATUS_URL=http://127.0.0.1:{{.OPERATOR_PORT}}/status pnpm frontend dev"
        exec env SUBMITTER_PRIVATE_KEY="$FUNDED_KEY" SP1_SKIP_PROGRAM_BUILD=true \
          cargo run -q --release --manifest-path zk/operator/Cargo.toml -- \
            --config {{.WORK}}/operator.toml

  prove:
    desc: 'Run the daemon until the trust root and the round root have both landed'
    deps: [config]
    cmds:
      - |
        export SUBMITTER_PRIVATE_KEY="$FUNDED_KEY" SP1_SKIP_PROGRAM_BUILD=true
        SNAP=$(task --silent demo:snapshot NAME='{{.NAME}}')
        # The round's snapshot too: the same daemon loop lands both roots (the trust instance from
        # the registry, the factory-minted round from its deploy artifact), so the loop is not done
        # until both are on chain. Absent — a deploy without a round — it degrades to trust alone.
        CSNAP=$(jq -r '.merkle_snapshot // empty' \
          .docker/contributions_round_dev_deploy.json 2>/dev/null)

        # The last thing the daemon did, WITH the reason when it failed. Printing only
        # `"event":"action_failed"` — as this did — turns every distinct failure into the same
        # five characters and hides the one sentence that says how to fix it.
        last() {
          jq -Rr 'fromjson? | select(.event | IN("triggered","proved","published","publication_failed",
                                                  "submitted","superseded","action_failed","tick_failed",
                                                  "pin_failed"))
                  | .event + (if .error then ": " + .error
                              elif .failures then ": " + (.failures | join("; "))
                              else "" end)' {{.WORK}}/run.log \
            | tail -1
        }
        landed() { cast call "$1" 'hasAppliedCheckpoint()(bool)' --rpc-url {{.RPC}} 2>/dev/null; }

        done_all=0
        for i in $(seq 1 {{.TICKS}}); do
          # anvil only mines on transactions, so nudge it or the epoch gates never open.
          cast rpc anvil_mine 8 --rpc-url {{.RPC}} >/dev/null
          cargo run -q --release --manifest-path zk/operator/Cargo.toml -- \
            --config {{.WORK}}/operator.toml --once >> {{.WORK}}/run.log 2>&1 || true
          T=$(landed "$SNAP"); R=true
          if [ -n "$CSNAP" ]; then
            R=$(landed "$CSNAP")
            echo "  tick $i: $(last)   [trust $T · round $R]"
          else
            echo "  tick $i: $(last)"
          fi
          if [ "$T" = "true" ] && [ "$R" = "true" ]; then
            echo "  ✓ every root landed by tick $i"; done_all=1; break
          fi
        done

        # Fail loudly, and say WHICH root is missing. Without this the demo exits 0 having proved
        # nothing, and the first sign of trouble is an empty network page several steps later —
        # which is where this last went wrong. The indexer builds its member list from the score
        # blob a landed root points at, so no root means no rows and a 404 on /network/<id>.
        if [ "$done_all" = "0" ]; then
          echo
          echo "  ✗ still waiting after {{.TICKS}} ticks (trust landed: $T, round landed: $R)."
          echo "    The daemon's last word:"
          echo "      $(last)"
          PUB_FAILURE=$(jq -Rr 'fromjson?
            | select(.event == "publication_failed")
            | .instance + ": " + (.failures | join("; "))' {{.WORK}}/run.log | tail -1)
          if [ -n "$PUB_FAILURE" ]; then
            echo "    last publication failure:"
            echo "      $PUB_FAILURE"
          fi
          echo "    full log: {{.WORK}}/run.log; per-instance decisions: {{.WORK}}/status.json"
          exit 1
        fi

  settle:
    desc: "Mine past Ponder's finality window so the indexer will actually serve what just happened"
    cmds:
      - |
        # anvil mines only on transactions, so the chain stops dead the moment the demo does — and
        # Ponder does not serve unfinalized blocks. It advances its finalized head only when
        # `latest >= finalized + 2 * finalityBlockCount`, then sets finalized to `latest - N`
        # (ponder/src/sync-realtime/index.ts). For chain 31337 there is no entry in Ponder's table,
        # so it falls through to the default N = 30 (`src/utils/finality.ts`).
        #
        # The consequence: the last ~60 blocks — the attestations, the checkpoint and the root
        # among them — sit forever one block short of visible. The indexer looks healthy, the API
        # 404s, and the page is empty. Mining 2N+ past the end is the whole fix.
        #
        # `anvil --block-time 1` avoids this permanently and is the better way to run a demo box.
        BEFORE=$(cast block-number --rpc-url {{.RPC}})
        cast rpc anvil_mine {{.SETTLE_BLOCKS}} --rpc-url {{.RPC}} >/dev/null
        echo "  ✓ mined to block $(cast block-number --rpc-url {{.RPC}}) (from $BEFORE) so Ponder can finalize"

  payout:
    desc: 'Fund the proven round and pay the contributors (skips itself without an indexer)'
    cmds:
      - |
        CSNAP=$(jq -r '.merkle_snapshot // empty' \
          .docker/contributions_round_dev_deploy.json 2>/dev/null)
        [ -n "$CSNAP" ] || { echo "  no contributions round in this deploy — nothing to pay"; exit 0; }

        # Fund and claim drive the payout page's exact seams, and both of those read the round
        # API: fund pins expectedRoot from it, claim fetches each persona's merkle bundle from it.
        # No indexer, no bundles — so skip rather than fail, the same contract `report` has. The
        # roots are landed either way; this step is the app-facing payoff, not the proof.
        if ! curl -s -o /dev/null -m 5 "{{.PONDER}}/" 2>/dev/null; then
          echo "  no indexer at {{.PONDER}} — skipping fund + claim"
          echo "  when one is up (pnpm indexer dev): task demo:payout"
          exit 0
        fi

        # `settle` just mined past Ponder's finality window, but ingesting the root and
        # re-deriving it from its own tables (that is what `verified` means) still takes the
        # indexer a moment. Poll briefly rather than failing on the race.
        V=""
        for i in $(seq 1 30); do
          V=$(curl -s -m 5 "{{.PONDER}}/contributions/$CSNAP/round" | jq -r '.verified // empty' 2>/dev/null)
          [ "$V" = "true" ] && break
          sleep 2
        done
        if [ "$V" != "true" ]; then
          echo "  ✗ the round never turned verified at {{.PONDER}}/contributions/$CSNAP/round"
          echo "    Either the indexer is behind (task demo:settle, wait, re-run task demo:payout),"
          echo "    or it refused controller history: the indexed full tuple must hash to the"
          echo "    checkpoint commitment before any scores are published."
          exit 1
        fi

        task contributions:fund-round AMOUNT={{.FUND_AMOUNT}}
        # The index of the distribution the fund JUST created, from the chain rather than a
        # guessed 0 — re-running against a long-lived chain creates index 1, 2, …
        DIST=$(jq -r .fund_distributor .docker/contributions_round_dev_deploy.json)
        IDX=$(( $(cast call "$DIST" 'getDistributionCount()(uint256)' --rpc-url {{.RPC}}) - 1 ))
        task contributions:claim-payouts INDEX=$IDX
        # The claims are transactions too — mine them past the finality window so the app shows
        # the claimed state, the same reason `settle` exists at all.
        cast rpc anvil_mine {{.SETTLE_BLOCKS}} --rpc-url {{.RPC}} >/dev/null
        echo "  ✓ round funded ({{.FUND_AMOUNT}} base units) and claimed (distribution $IDX)"

  resolver:
    desc: "The instance's EASIndexerResolver (its accumulator), from the registry"
    cmds:
      - |
        REG=$(jq -r .instance_registry .docker/instance_registry_deploy.json)
        cast call "$REG" 'getInstance(bytes32)((bytes32,address,address,address,bytes32))' \
          "$(task --silent demo:id NAME='{{.NAME}}')" --rpc-url {{.RPC}} | tr -d '()' | cut -d, -f4 | tr -d ' '

  snapshot:
    desc: "The instance's MerkleSnapshot address, from the registry"
    cmds:
      - |
        REG=$(jq -r .instance_registry .docker/instance_registry_deploy.json)
        cast call "$REG" 'getInstance(bytes32)((bytes32,address,address,address,bytes32))' \
          "$(task --silent demo:id NAME='{{.NAME}}')" --rpc-url {{.RPC}} | tr -d '()' | cut -d, -f2 | tr -d ' '

  report:
    desc: "What happened: the root, the payment, and every instance's decision"
    cmds:
      - |
        R={{.RPC}}
        VAULT=$(jq -r .proving_vault .docker/proving_vault_deploy.json)
        ID=$(task --silent demo:id NAME='{{.NAME}}'); SNAP=$(task --silent demo:snapshot NAME='{{.NAME}}')
        PAYEE=$(cast wallet address --private-key "$FUNDED_KEY")
        echo
        echo "  root landed   $(cast call "$SNAP" 'hasAppliedCheckpoint()(bool)' --rpc-url $R) (checkpoint $(cast call "$SNAP" 'lastAppliedCheckpoint()(uint256)' --rpc-url $R))"
        echo "  tank left     $(cast call "$VAULT" 'accountOf(bytes32)((address,bytes32,uint128,uint128))' "$ID" --rpc-url $R)"
        echo "  prover paid   $(cast call "$VAULT" 'creditOf(address,address)(uint256)' "$PAYEE" 0x0000000000000000000000000000000000000000 --rpc-url $R) wei"

        # The root is only half of it. The chain carries the root, its sha256 and the CID — never
        # the scores — so the indexer builds every member list by fetching that CID. If it is not
        # readable through the gateway the INDEXER uses, `merkle.ts` throws, Ponder retries that
        # one event forever, and the UI shows an empty roster over a perfectly valid proof. Read
        # it the way the indexer will, not the way we published it.
        N=$(cast call "$SNAP" 'getStateCount()(uint256)' --rpc-url $R 2>/dev/null | cut -d' ' -f1)
        CID=$([ "${N:-0}" -gt 0 ] 2>/dev/null && cast call "$SNAP" \
          'getStateAtIndex(uint256)((uint256,uint256,bytes32,bytes32,string,uint256))' \
          $((N - 1)) --rpc-url $R 2>/dev/null | sed 's/.*"\(.*\)".*/\1/')
        if [ -n "$CID" ]; then
          CODE=$(curl -s -o /dev/null -m 20 -w '%{http_code}' "{{.IPFS_GATEWAY}}$CID" || echo 000)
          if [ "$CODE" = "200" ]; then
            echo "  scores        readable at {{.IPFS_GATEWAY}}$CID"
          else
            echo "  scores        ✗ HTTP $CODE at {{.IPFS_GATEWAY}}$CID"
            echo "                the root is valid but its scores are unreadable. The indexer"
            echo "                will queue retries and current-score pages return HTTP 503."
            echo "                the add and this read are hitting different nodes: compare"
            echo "                {{.IPFS_API}}/api/v0/id with whatever serves {{.IPFS_GATEWAY}}"
          fi
        fi

        # And the only question a demo viewer actually asks: does the app show anything? This is
        # the exact endpoint the network page reads its roster and attestation feed from, so a 404
        # here IS the empty page — no need to open a browser to find out. Skipped, not failed, when
        # no indexer is running: `task demo` does not require one.
        if curl -s -o /dev/null -m 5 "{{.PONDER}}/" 2>/dev/null; then
          CODE=$(curl -s -o /dev/null -m 15 -w '%{http_code}' "{{.PONDER}}/network/$SNAP" || echo 000)
          if [ "$CODE" = "200" ]; then
            echo "  indexer       serving {{.PONDER}}/network/$SNAP"
          else
            echo "  indexer       ✗ HTTP $CODE at {{.PONDER}}/network/$SNAP — the app will be empty"
            echo "                if the scores line above is fine, the indexer is either behind"
            echo "                (mine more: task demo:settle) or replaying a previous anvil"
            echo "                (restart through 'pnpm indexer dev'; its chain guard resets local state)"
          fi
        fi

        # The round, in the same three questions: landed, funded, and did anyone get paid. ALICE
        # is the fixture's top contributor (anvil account 1), so her pool-token balance is the one
        # number that proves the whole path — claims, valuations, proof, root, fund, merkle claim
        # — moved real value. Zero here with a landed round just means `payout` was skipped.
        CSNAP=$(jq -r '.merkle_snapshot // empty' \
          .docker/contributions_round_dev_deploy.json 2>/dev/null)
        if [ -n "$CSNAP" ]; then
          contrib() { jq -r ".$1 // empty" .docker/contributions_round_dev_deploy.json; }
          echo
          echo "  round landed  $(cast call "$CSNAP" 'hasAppliedCheckpoint()(bool)' --rpc-url $R) (checkpoint $(cast call "$CSNAP" 'lastAppliedCheckpoint()(uint256)' --rpc-url $R))"
          echo "  round funded  $(cast call "$(contrib fund_distributor)" 'getDistributionCount()(uint256)' --rpc-url $R) distribution(s)"
          POOL=$(contrib pool_token)
          [ -n "$POOL" ] && echo "  ALICE holds   $(cast call "$POOL" 'balanceOf(address)(uint256)' 0x70997970C51812dc3A010C7d01b50e0d17dc79C8 --rpc-url $R) tUSDC base units"
          if curl -s -o /dev/null -m 5 "{{.PONDER}}/" 2>/dev/null; then
            echo "  round API     $(curl -s -m 10 "{{.PONDER}}/contributions/$CSNAP/round" | jq -c '{verified, numClaims, numRecipients, totalValue}' 2>/dev/null || echo unreachable)"
          fi
        fi
        echo
        # The one thing worth reading when a number above is wrong.
        [ -f {{.WORK}}/status.json ] && jq -c '[.instances[] | {name, do: .action.action,
          why: (.action.hold // .action.idle // .action.skip)}]' {{.WORK}}/status.json

  clean:
    desc: "Throw away the demo's local state (not the chain)"
    cmds:
      - rm -rf {{.WORK}}
      - echo "✓ removed {{.WORK}} (the operator's whole state directory)"
