version: '3'

includes:
  config: ./config.yml

vars:
  DEPLOY_SUMMARY: '.docker/deployment_summary.json'

tasks:
  get-rpc:
    desc: 'Get RPC URL'
    env:
      DEPLOY_TARGET:
        sh: task get-deploy-target
    cmds:
      - |
        # Get deployment environment
        if [ ! -f .env ]; then
          cp .env.example .env
        fi

        # Get RPC URL based on chain target. Credentials remain only in .env.
        if [ "$DEPLOY_TARGET" = "sepolia" ]; then
          grep -E "^(RPC_URL|PONDER_RPC_URL_11155111)=" .env | tail -1 | cut -d '=' -f2-
        elif [ "$DEPLOY_TARGET" = "optimism" ]; then
          grep -E "^(RPC_URL|PONDER_RPC_URL_10)=" .env | tail -1 | cut -d '=' -f2-
        elif [ "$DEPLOY_TARGET" = "local" ]; then
          grep "^RPC_URL=" .env | cut -d '=' -f2-
        else
          echo "Unknown DEPLOY_TARGET: $DEPLOY_TARGET" >&2
          exit 1
        fi

  get-chain-id:
    desc: 'Get chain ID'
    cmds:
      - |
        if [ ! -f .env ]; then
          cp .env.example .env
        fi
        TARGET=$(task get-deploy-target)
        case "$TARGET" in
          local) echo 31337 ;;
          optimism) echo 10 ;;
          sepolia) echo 11155111 ;;
          mainnet) echo 1 ;;
        esac

  get-deploy-status:
    desc: 'Get deployment environment status'
    cmds:
      - |
        # Get deployment environment
        if [ ! -f .env ]; then
          cp .env.example .env
        fi
        DEPLOY_ENV=$(grep "^DEPLOY_ENV=" .env | cut -d '=' -f2 | tr '[:lower:]' '[:upper:]' | tr -d '\r\n')
        echo "$DEPLOY_ENV"

  get-deploy-stage:
    desc: 'Get deployment validation stage'
    cmds:
      - |
        if [ ! -f .env ]; then cp .env.example .env; fi
        STAGE=$(grep "^DEPLOY_STAGE=" .env | cut -d '=' -f2 | tr '[:upper:]' '[:lower:]' | tr -d '\r\n')
        if [ -z "$STAGE" ]; then
          LEGACY=$(task get-deploy-status)
          [ "$LEGACY" = "PROD" ] && STAGE=production || STAGE=development
        fi
        case "$STAGE" in development|production) echo "$STAGE" ;; *) echo "Unknown DEPLOY_STAGE: $STAGE" >&2; exit 1 ;; esac

  get-deploy-target:
    desc: 'Get deployment chain target'
    cmds:
      - |
        if [ ! -f .env ]; then cp .env.example .env; fi
        TARGET=$(grep "^DEPLOY_TARGET=" .env | cut -d '=' -f2 | tr '[:upper:]' '[:lower:]' | tr -d '\r\n')
        if [ -z "$TARGET" ]; then
          LEGACY=$(task get-deploy-status)
          [ "$LEGACY" = "PROD" ] && TARGET=optimism || TARGET=local
        fi
        case "$TARGET" in local|optimism|sepolia|mainnet) echo "$TARGET" ;; *) echo "Unknown DEPLOY_TARGET: $TARGET" >&2; exit 1 ;; esac

  get-ipfs-gateway:
    desc: 'Get IPFS gateway based on deployment environment'
    cmds:
      - |
        DEPLOY_ENV=$(task get-deploy-status)
        if [ "$DEPLOY_ENV" = "DEV" ]; then
          echo "http://127.0.0.1:8080/ipfs/"
        elif [ "$DEPLOY_ENV" = "PROD" ]; then
          echo "https://gateway.pinata.cloud/ipfs/"
        else
          echo "Unknown DEPLOY_ENV: $DEPLOY_ENV" >&2
          exit 1
        fi

  show-deploy-summary:
    desc: 'Display all deployment addresses'
    preconditions:
      - test -f {{.DEPLOY_SUMMARY}}
    cmds:
      - |
        echo "📋 Deployment Summary"
        echo "===================="
        jq . {{.DEPLOY_SUMMARY}}
