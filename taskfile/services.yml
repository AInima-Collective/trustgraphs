version: '3'

tasks:
  start-all:
    desc: 'Start all local services (anvil, IPFS, ponder-db)'
    cmds:
      - |
        set -e

        # if [ -f .env ] && grep -q '^RPC_URL=' .env; then
        #   RPC_URL=$(grep -E '^RPC_URL=' .env | cut -d '=' -f2- | tr -d '"')
        # else
        #   RPC_URL="https://ethereum-sepolia-rpc.publicnode.com"
        #   echo "No RPC_URL found in .env, using default ${RPC_URL}"
        # fi

        PORT=8545
        FORK_RPC_URL=${FORK_RPC_URL:-"${RPC_URL}"}
        DEPLOY_TARGET=$(task get-deploy-target)

        ## == Base Anvil Testnet Fork ==
        if [ "$DEPLOY_TARGET" != "local" ]; then
          echo "Targeting $DEPLOY_TARGET, no local services to start"
          exit 0
        elif [ "$DEPLOY_TARGET" = "local" ]; then
          # anvil --fork-url ${FORK_RPC_URL} --port ${PORT} &
          # removed the fork-url since this moved off of eigen and does not need (constantly hitting a Error: Failed to send transaction Context: - server returned an error response: error code -32003: Insufficient funds for gas * price + value)
          # anvil --port $PORT &
          # trap "killall anvil && echo -e '\nKilled anvil'" EXIT
          while ! cast block-number --rpc-url http://localhost:${PORT} > /dev/null 2>&1
          do
            sleep 0.25
          done

          FILES="-f docker-compose.dev.yml"
          docker compose ${FILES} pull
          docker compose ${FILES} up --force-recreate -d
          trap "docker compose ${FILES} down --remove-orphans && echo -e '\nKilled IPFS + ponder-db'" EXIT

          echo "Started..."
          wait
        fi

  stop-all:
    desc: 'Stop all local services'
    cmds:
      - |
        DEPLOY_TARGET=$(task get-deploy-target)
        if [ "$DEPLOY_TARGET" != "local" ]; then
          echo "Targeting $DEPLOY_TARGET, no local services to stop"
          exit 0
        fi

        echo "Stopping all services..."
        FILES="-f docker-compose.dev.yml"
        docker compose ${FILES} down --remove-orphans || true
        pkill -x anvil || true
        echo "All services stopped"
