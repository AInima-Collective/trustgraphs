version: "3"

silent: true

# ZK program tasks (multi-program platform).
#
# Every task takes PROGRAM (values: trust-graph | signer | hypercerts | contributions, default
# trust-graph). The prover CLI is invoked as `trustgraph-prover <program> <command>`, so PROGRAM is
# passed as the first positional arg. The `trust-graph` and `signer` programs share the same golden
# feed (test/golden/trust-graph.json) because the signer program reads the same trust-graph
# attestation feed — there is no separate signer vector file; `hypercerts` and `contributions` each
# own their own vector file.

tasks:
  build:
    desc: "Build the SP1 guest ELFs + the prover host (do this once before task demo / task e2e)"
    cmds:
      # Nothing else in this repo builds the guests on purpose. `zk/prover/build.rs` calls
      # `sp1_build::build_program("../program")`, so a plain host build would — except every demo
      # task, `test/e2e/operator.sh` and `test/e2e/fork.sh` export SP1_SKIP_PROGRAM_BUILD=true,
      # which makes build.rs emit the ELF *paths* without producing the ELFs. On a checkout that
      # has never built them the host then fails at `include_elf!` with a missing-file error naming
      # a path under zk/program/target — which reads like a broken repo and is really "run this".
      - |
        command -v cargo-prove >/dev/null 2>&1 || {
          echo "✗ cargo-prove not found. The guests build with the SP1 \`succinct\` toolchain:" >&2
          echo "    curl -L https://sp1up.succinct.xyz | bash && ~/.sp1/bin/sp1up --version v6.3.1" >&2
          echo "    export PATH=\"\$HOME/.sp1/bin:\$PATH\"" >&2
          exit 1
        }
        echo "→ building the guest ELFs (first run takes a few minutes; after that it's cached)"
        cd zk/program && cargo prove build
      # sp1_build does NOT watch the path deps under packages/, so cargo will happily reuse a stale
      # ELF after you edit a core crate. Touching build.rs forces the directive re-emit, which is
      # what picks the freshly built ELFs up.
      - touch zk/prover/build.rs
      # The guests were just built explicitly, so skip build.rs's copy of that work rather than
      # doing it twice. Three host artifacts, because `task demo` needs all three warm and cargo
      # caches per feature set: the plain prover (vkey derivation, e2e), the prover with `fetch`
      # (the daemon shells `cargo run --features fetch -- contributions fetch` to reconstruct
      # round inputs from chain — cold, that's a multi-minute build in the middle of the prove
      # loop), and the operator daemon itself (otherwise its first tick pays the same bill).
      - SP1_SKIP_PROGRAM_BUILD=true sh -c 'cd zk/prover && cargo build --release && cargo build --release --features fetch'
      - SP1_SKIP_PROGRAM_BUILD=true cargo build --release --manifest-path zk/operator/Cargo.toml
      - echo "✓ guests + host + operator built. Vkeys they produce - task demo:vkeys"

  vectors:
    desc: "Regenerate golden vectors for PROGRAM (trust-graph | signer | hypercerts | contributions)"
    vars:
      PROGRAM: '{{.PROGRAM | default "trust-graph"}}'
    cmds:
      # `hypercerts` and `contributions` own their own vector files (test/golden/<program>.json);
      # trust-graph and signer share test/golden/trust-graph.json — the signer vectors live in its
      # `.signer` section — so regeneration for those two is the same command regardless of PROGRAM.
      - '{{if eq .PROGRAM "hypercerts"}}cargo run -p hypercerts-core --example export_golden > test/golden/hypercerts.json{{else if eq .PROGRAM "contributions"}}cargo run -p contributions-core --example export_golden > test/golden/contributions.json{{else}}cargo run -p pagerank-core --example export_golden > test/golden/trust-graph.json{{end}}'

  vkey:
    desc: "Print the SP1 program vkey for PROGRAM (trust-graph | signer | hypercerts | contributions)"
    vars:
      PROGRAM: '{{.PROGRAM | default "trust-graph"}}'
    env:
      # vkey derivation only needs setup, not a prover backend; cpu/network backends eagerly
      # allocate the ~5 GiB CPU prover machine. The vkey is identical under mock.
      SP1_PROVER: mock
      # Printing a vkey must never CHANGE the vkey: without this, build.rs rebuilds the guests
      # with the local toolchain and the answer drifts from what any deployed verifier pinned.
      # Only `task zk:build` builds guests.
      SP1_SKIP_PROGRAM_BUILD: 'true'
    cmds:
      - cd zk/prover && cargo run --release -- {{.PROGRAM}} vkey

  execute:
    desc: "Execute the guest for PROGRAM (guest==native byte-assert); optional INPUT= file"
    vars:
      PROGRAM: '{{.PROGRAM | default "trust-graph"}}'
      INPUT: '{{.INPUT}}'
    env:
      # execute never produces a proof — the executor + byte-assert are identical under mock,
      # and the cpu/network backends' eager CPU-prover allocation OOMs small boxes/CI runners.
      SP1_PROVER: mock
      SP1_SKIP_PROGRAM_BUILD: 'true'
    cmds:
      - cd zk/prover && cargo run --release -- {{.PROGRAM}} execute {{.INPUT}}

  prove:
    desc: "Prove the guest for PROGRAM (trust-graph | signer | hypercerts | contributions); GROTH16=1 for a groth16 proof, optional INPUT="
    vars:
      PROGRAM: '{{.PROGRAM | default "trust-graph"}}'
      INPUT: '{{.INPUT}}'
    env:
      SP1_SKIP_PROGRAM_BUILD: 'true'
    cmds:
      - cd zk/prover && cargo run --release -- {{.PROGRAM}} prove {{.INPUT}} {{if eq .GROTH16 "1"}}--groth16{{end}}

  parity:
    desc: "Aggregate cross-language parity gate for PROGRAM (trust-graph | signer | hypercerts | contributions)"
    vars:
      PROGRAM: '{{.PROGRAM | default "trust-graph"}}'
    cmds:
      # (a) Regenerate golden vectors and fail if the encodings drifted without regenerated vectors.
      - task: vectors
        vars: { PROGRAM: "{{.PROGRAM}}" }
      - git diff --exit-code test/golden/
      # (b) Rust parity (canonical core + zk glue + program crates).
      - cargo test -p pagerank-core -p zk-core -p hypercerts-core -p contributions-core
      # (c) Solidity golden vectors (both split suites).
      - forge test --match-path "test/unit/golden/*"
      # (d) Frontend TS port golden vectors.
      - cd frontend && pnpm test
      # (e) Guest==native byte-assert for PROGRAM.
      - task: execute
        vars: { PROGRAM: "{{.PROGRAM}}" }
