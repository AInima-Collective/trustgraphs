version: '3'

silent: true

# ZK program tasks (multi-program platform).
#
# Every task takes PROGRAM (values: trust-graph | trust-graph-weighted | trust-compose |
# signer | hypercerts | contributions | nostr-workspace, default trust-graph). The prover CLI is invoked as
# `trustgraph-prover <program> <command>`, so PROGRAM is passed as the first positional arg. The
# `trust-graph` and `signer` programs share one golden feed because signer reads the same trust-graph
# attestations; every other program owns its vector file.

tasks:
  build:
    desc: 'Build SP1 guest ELFs + prover host; rerun after every crates/ edit'
    cmds:
      # Nothing else in this repo builds the guests on purpose. `zk/prover/build.rs` calls the SP1
      # builder for every guest workspace, but every demo task and e2e
      # script exports SP1_SKIP_PROGRAM_BUILD=true. That makes build.rs emit ELF *paths* without
      # producing the ELFs. On a checkout that has never built them the host then fails at
      # `include_elf!` with a missing-file error — which reads like a broken repo and is really
      # "run this".
      # One implementation, used by this task, the operator's Dockerfile and CI: the guests are
      # compiled inside the pinned SP1 builder image so two machines building one commit produce
      # the same bytes. The script also touches zk/prover/build.rs afterwards, because sp1_build
      # does NOT watch path dependencies and cargo will otherwise reuse an ELF that predates a
      # crates/ edit.
      - sh scripts/build-guests.sh
      # The guests were just built explicitly, so skip build.rs's copy of that work rather than
      # doing it twice. Four host artifacts, because `task demo` and witness operations need them
      # warm and cargo caches per feature set: the plain prover (vkey derivation, e2e), the prover with `fetch`
      # (the daemon shells `cargo run --features fetch -- contributions fetch` to reconstruct
      # round inputs from chain — cold, that's a multi-minute build in the middle of the prove
      # loop), the Nostr collection/anchor host, and the operator daemon itself (otherwise its
      # first tick pays the same bill).
      - SP1_SKIP_PROGRAM_BUILD=true sh -c 'cd zk/prover && cargo build --release && cargo build --release --features fetch && cargo build --release --features witness-nostr'
      - SP1_SKIP_PROGRAM_BUILD=true cargo build --release --manifest-path zk/operator/Cargo.toml
      - echo "✓ guests + host + operator built. Vkeys they produce - task demo:vkeys"

  elf-digests:
    desc: 'sha256 of every built guest ELF — the value two machines must agree on'
    cmds:
      - sh scripts/guest-elf-digests.sh

  manifest:
    desc: 'Every program ELF sha256 + vkey as JSON (the Lane C reproducible-build artifact)'
    cmds:
      - SP1_SKIP_PROGRAM_BUILD=true SP1_PROVER=mock cargo run -q --release --manifest-path zk/prover/Cargo.toml -- manifest

  vectors:
    desc: 'Regenerate golden vectors for PROGRAM'
    vars:
      PROGRAM: '{{.PROGRAM | default "trust-graph"}}'
    cmds:
      - '{{if eq .PROGRAM "trust-compose"}}pnpm exec tsx research/composition/export-production-fixture.ts{{else if eq .PROGRAM "trust-graph-weighted"}}cargo run -p weighted-prior-core --example export_golden > tests/golden/weighted-prior.json{{else if eq .PROGRAM "hypercerts"}}cargo run -p hypercerts-core --example export_golden > tests/golden/hypercerts.json{{else if eq .PROGRAM "contributions"}}cargo run -p contributions-core --example export_golden > tests/golden/contributions.json{{else if eq .PROGRAM "nostr-workspace"}}cargo run -p nostr-workspace-core --example export_golden > tests/golden/nostr-workspace.json{{else}}cargo run -p pagerank-core --example export_golden > tests/golden/trust-graph.json{{end}}'

  vkey:
    desc: 'Print the SP1 program vkey for PROGRAM'
    vars:
      PROGRAM: '{{.PROGRAM | default "trust-graph"}}'
    env:
      # vkey derivation only needs setup, not a prover backend; cpu/network backends eagerly
      # allocate the ~5 GiB CPU prover machine. The vkey is identical under mock.
      SP1_PROVER: mock
      # Printing a vkey must never CHANGE the vkey: without this, build.rs rebuilds the guests
      # with the local toolchain and the answer drifts from what any deployed verifier pinned.
      # Only `task zk:build` builds guests.
      SP1_SKIP_PROGRAM_BUILD: 'true'
    cmds:
      - cd zk/prover && cargo run --release -- {{.PROGRAM}} vkey

  execute:
    desc: 'Execute the guest for PROGRAM (guest==native byte-assert); optional INPUT= file'
    vars:
      PROGRAM: '{{.PROGRAM | default "trust-graph"}}'
      INPUT: '{{.INPUT}}'
    env:
      # execute never produces a proof — the executor + byte-assert are identical under mock,
      # and the cpu/network backends' eager CPU-prover allocation OOMs small boxes/CI runners.
      SP1_PROVER: mock
      SP1_SKIP_PROGRAM_BUILD: 'true'
    cmds:
      - cd zk/prover && cargo run --release -- {{.PROGRAM}} execute {{.INPUT}}

  prove:
    desc: 'Prove the guest for PROGRAM; GROTH16=1 for a groth16 proof, optional INPUT='
    vars:
      PROGRAM: '{{.PROGRAM | default "trust-graph"}}'
      INPUT: '{{.INPUT}}'
    env:
      SP1_SKIP_PROGRAM_BUILD: 'true'
    cmds:
      - cd zk/prover && cargo run --release -- {{.PROGRAM}} prove {{.INPUT}} {{if eq .GROTH16 "1"}}--groth16{{end}}

  nostr-witness-smoke:
    desc: 'S3 gate: deterministic Nostr export → Anvil anchor → offline assemble/execute/prove'
    env:
      SP1_SKIP_PROGRAM_BUILD: 'true'
    cmds:
      - scripts/nostr-witness-anvil-smoke.sh

  nostr-workspace-e2e:
    desc: 'S4 gate: two Nostr epochs → publish/submit → replay rejection → composition capture'
    env:
      SP1_SKIP_PROGRAM_BUILD: 'true'
    cmds:
      - scripts/nostr-workspace-two-epoch-e2e.sh

  parity:
    desc: 'Aggregate cross-language parity gate for PROGRAM'
    vars:
      PROGRAM: '{{.PROGRAM | default "trust-graph"}}'
    cmds:
      # (a) Regenerate golden vectors and fail if the encodings drifted without regenerated vectors.
      - task: vectors
        vars: { PROGRAM: '{{.PROGRAM}}' }
      - git diff --exit-code tests/golden/
      # (b) Rust parity (canonical core + zk glue + program crates).
      - cargo test -p pagerank-core -p zk-core -p hypercerts-core -p contributions-core -p weighted-prior-core -p composition-core -p composition-core -p nostr-envelope -p nostr-workspace-core
      # (c) Solidity golden vectors (both split suites).
      - forge test --match-path "contracts/test/unit/golden/*"
      # (d) The independent TypeScript composition oracle, then frontend TS ports.
      - |
        if [ "{{.PROGRAM}}" = "trust-compose" ]; then
          node --import tsx --test research/composition/reference.test.ts \
            research/composition/production-v2.test.ts
          pnpm exec tsc --ignoreConfig research/composition/*.ts --noEmit \
            --module esnext --moduleResolution bundler --target es2022 --skipLibCheck --strict \
            --types node --typeRoots packages/indexer/node_modules/@types
        fi
      - cd packages/frontend && pnpm test
      # (e) Guest==native byte-assert for PROGRAM.
      - task: execute
        vars: { PROGRAM: '{{.PROGRAM}}' }
