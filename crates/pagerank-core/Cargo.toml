[package]
name = "pagerank-core"
description = "Canonical fixed-point Trust-Aware PageRank + encodings (single source of truth for zkVM guest, host, and browser)"
edition.workspace = true
version.workspace = true
authors.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
# Keep deps minimal and zkVM-friendly. No floats, no wasm-bindgen, no async.
alloy-primitives = { workspace = true, features = ["serde"] }
zk-core = { path = "../zk-core" }
envelopes = { path = "../envelopes" }
serde = { workspace = true, features = ["derive"] }

[dev-dependencies]
k256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
serde_json = { workspace = true }
hex = { workspace = true }
proptest = "1.7"

[lints.clippy]
manual_div_ceil = "allow"
unnecessary_sort_by = "allow"

# NOTE: this crate must also compile for the SP1 zkVM target (riscv32im-succinct-zkvm-elf).
# It uses std (SP1 provides a std shim) but no platform-dependent or floating-point operations.
