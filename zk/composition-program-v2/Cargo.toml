[package]
name = "trustgraph-compose-program-v2"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "trustgraph-compose-program-v2"
path = "src/main.rs"

[dependencies]
sp1-zkvm = "=6.3.1"
composition-core-v2 = { path = "../../crates/composition-core-v2" }

# Distinct workspace: the new guest cannot perturb any shipped program dependency graph or vkey.
[workspace]

[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.0.0" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.11.0-sp1-6.0.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
