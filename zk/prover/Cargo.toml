[package]
name = "trustgraph-prover"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "trustgraph-prover"
path = "src/main.rs"

[features]
# Opt-in: build the native gnark prover so `prove --groth16` can wrap Groth16 LOCALLY
# (SP1_PROVER=cpu, needs ~16-32 GiB + a working gnark/Go toolchain). Leave OFF for `execute` and for
# `SP1_PROVER=network` proving (the network wraps Groth16 remotely), so the default build stays light.
#   local groth16:  cargo run --features native-gnark --release -- prove input.json --groth16
native-gnark = ["sp1-sdk/native-gnark"]

[dependencies]
sp1-sdk = { version = "=6.3.1", features = ["blocking"] }
pagerank-core = { path = "../../packages/pagerank-core" }
alloy-primitives = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"

[build-dependencies]
sp1-build = "=6.3.1"

# Detached from the root workspace: sp1-sdk brings its own (large) dependency graph that must not
# be unified with the alloy graph of the main workspace.
[workspace]
