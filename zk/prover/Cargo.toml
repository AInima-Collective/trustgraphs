[package]
name = "trustgraph-prover"
version = "0.1.0"
edition = "2021"

[lib]
name = "trustgraph_prover"
path = "src/lib.rs"

[[bin]]
name = "trustgraph-prover"
path = "src/main.rs"

[features]
# Opt-in: build the native gnark prover so `prove --groth16` can wrap Groth16 LOCALLY
# (SP1_PROVER=cpu, needs ~16-32 GiB + a working gnark/Go toolchain). Leave OFF for `execute` and for
# `SP1_PROVER=network` proving (the network wraps Groth16 remotely), so the default build stays light.
#   local groth16:  cargo run --features native-gnark --release -- prove input.json --groth16
native-gnark = ["sp1-sdk/native-gnark"]

# Opt-in: the Succinct prover-network client (`SP1_PROVER=network` + `NETWORK_PRIVATE_KEY`).
# Pulls the grpc/tonic graph, so it stays out of the lean default build like the others.
#   cargo run --release --features network -- hypercerts prove input.json --groth16
network = ["sp1-sdk/network"]

# Opt-in: host-side lane-2 (atproto) witness assembly — the `witness` subcommand group.
# Pulls the network/DAG-CBOR/date deps (reqwest + ipld + chrono) that the lean `prove`/`execute`
# builds must NOT carry; leave OFF unless you are fetching CARs/PLC logs off the live network.
#   cargo build  --release --features witness-atproto
#   cargo run    --release --features witness-atproto -- witness fetch --did did:plc:...
witness-atproto = [
    "dep:reqwest",

]

# Opt-in: privileged Buzz/Nostr collection, immutable archive management, on-chain anchor
# preflight/submission, and offline checkpoint assembly. The resulting GuestInput needs no network
# or credentials and is consumed by the default `nostr-workspace execute|prove` commands.
#   cargo run --release --features witness-nostr -- nostr-witness inspect ...
#   cargo run --release --features witness-nostr -- nostr-witness export  ...
#   cargo run --release --features witness-nostr -- nostr-witness anchor  ...
#   cargo run --release --features witness-nostr -- nostr-witness assemble ...
witness-nostr = [
    "dep:reqwest",
    "dep:alloy-sol-types",
    "dep:postgres",
    "dep:uuid",
    "dep:k256",
]

# Opt-in: on-chain input reconstruction — `contributions fetch` (input.json from the two
# checkpointed accumulators of a contributions instance, same refuse-to-emit re-fold discipline
# as crates/input-exporter). Pulls reqwest + the sol! ABI machinery, kept out of the lean
# default build like witness-atproto.
#   cargo run --release --features fetch -- contributions fetch --rpc ... --snapshot ... --eas ... --checkpoint 0 --params params.json
fetch = ["dep:reqwest", "dep:alloy-sol-types"]

[dependencies]
sp1-sdk = { version = "=6.6.0", features = ["blocking"] }
sp1-core-executor = "=6.6.0"
pagerank-core = { path = "../../crates/pagerank-core" }
trustgraph-core = { path = "../../crates/trustgraph-core" }
hypercerts-core = { path = "../../crates/hypercerts-core" }
nostr-workspace-core = { path = "../../crates/nostr-workspace-core" }
nostr-envelope = { path = "../../crates/nostr-envelope" }
contributions-core = { path = "../../crates/contributions-core" }
weighted-prior-core = { path = "../../crates/weighted-prior-core" }
composition-core = { path = "../../crates/composition-core" }
alloy-primitives = { version = "1", features = ["serde"] }
# fetch feature only: the sol! call/event ABI plumbing for on-chain reconstruction.
alloy-sol-types = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
bincode = "1"
clap = { version = "4", features = ["derive"] }

# The envelope verifier crate (light; guest-grade deps) — reused verbatim on the host so the
# assembled bundle is byte-checked against the SAME code the guest runs.
envelopes = { path = "../../crates/envelopes" }
zk-core = { path = "../../crates/zk-core" }
# reqwest blocking follows the getRepo 302 → PDS host automatically. rustls to avoid
# a system-OpenSSL build dependency. Only the witness/fetch features need it.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"], optional = true }
ipld-core = { version = "0.4" }
serde_ipld_dagcbor = { version = "=0.6.4" }
sha2 = { version = "0.10", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
postgres = { version = "0.19", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"], optional = true }
uuid = { version = "1", features = ["serde"], optional = true }
k256 = { version = "0.13.4", features = ["ecdsa"], optional = true }

[build-dependencies]
sp1-build = "=6.6.0"

[dev-dependencies]
# Research-only benchmark support; this does not enter the production prover dependency graph.
erc8004-completeness-research = { path = "../../research/erc8004-completeness/rust" }
weighted-prior-research = { path = "../../research/weighted-priors/core" }
operator-core = { path = "../../crates/operator-core" }

# Detached from the root workspace: sp1-sdk brings its own (large) dependency graph that must not
# be unified with the alloy graph of the main workspace.
[workspace]
