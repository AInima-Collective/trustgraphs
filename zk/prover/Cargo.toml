[package]
name = "trustgraph-prover"
version = "0.1.0"
edition = "2021"

[lib]
name = "trustgraph_prover"
path = "src/lib.rs"

[[bin]]
name = "trustgraph-prover"
path = "src/main.rs"

[features]
# Opt-in: build the native gnark prover so `prove --groth16` can wrap Groth16 LOCALLY
# (SP1_PROVER=cpu, needs ~16-32 GiB + a working gnark/Go toolchain). Leave OFF for `execute` and for
# `SP1_PROVER=network` proving (the network wraps Groth16 remotely), so the default build stays light.
#   local groth16:  cargo run --features native-gnark --release -- prove input.json --groth16
native-gnark = ["sp1-sdk/native-gnark"]

# Opt-in: the Succinct prover-network client (`SP1_PROVER=network` + `NETWORK_PRIVATE_KEY`).
# Pulls the grpc/tonic graph, so it stays out of the lean default build like the others.
#   cargo run --release --features network -- hypercerts prove input.json --groth16
network = ["sp1-sdk/network"]

# Opt-in: host-side lane-2 (atproto) witness assembly — the `witness` subcommand group.
# Pulls the network/DAG-CBOR/date deps (reqwest + ipld + chrono) that the lean `prove`/`execute`
# builds must NOT carry; leave OFF unless you are fetching CARs/PLC logs off the live network.
#   cargo build  --release --features witness-atproto
#   cargo run    --release --features witness-atproto -- witness fetch --did did:plc:...
witness-atproto = [
    "dep:reqwest",

]

# Opt-in: on-chain input reconstruction — `contributions fetch` (input.json from the two
# checkpointed accumulators of a contributions instance, same refuse-to-emit re-fold discipline
# as packages/input-exporter). Pulls reqwest + the sol! ABI machinery, kept out of the lean
# default build like witness-atproto.
#   cargo run --release --features fetch -- contributions fetch --rpc ... --snapshot ... --eas ... --checkpoint 0 --params params.json
fetch = ["dep:reqwest", "dep:alloy-sol-types"]

[dependencies]
sp1-sdk = { version = "=6.3.1", features = ["blocking"] }
sp1-core-executor = "=6.3.1"
pagerank-core = { path = "../../packages/pagerank-core" }
hypercerts-core = { path = "../../packages/hypercerts-core" }
contributions-core = { path = "../../packages/contributions-core" }
weighted-prior-core = { path = "../../packages/weighted-prior-core" }
weighted-prior-research = { path = "../../packages/weighted-prior-research" }
alloy-primitives = { version = "1", features = ["serde"] }
# fetch feature only: the sol! call/event ABI plumbing for on-chain reconstruction.
alloy-sol-types = { version = "1", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
hex = "0.4"
bincode = "1"
clap = { version = "4", features = ["derive"] }

# --- witness-atproto feature only (host-side, heavy; kept out of default builds) ---
# The envelope verifier crate (light; guest-grade deps) — reused verbatim on the host so the
# assembled bundle is byte-checked against the SAME code the guest runs.
envelopes = { path = "../../packages/envelopes" }
zk-core = { path = "../../packages/zk-core" }
# reqwest blocking follows the getRepo 302 → PDS host automatically (M1 finding). rustls to avoid
# a system-OpenSSL build dependency.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"], optional = true }
ipld-core = { version = "0.4" }
serde_ipld_dagcbor = { version = "=0.6.4" }
sha2 = { version = "0.10", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"], optional = false }

[build-dependencies]
sp1-build = "=6.3.1"

# Detached from the root workspace: sp1-sdk brings its own (large) dependency graph that must not
# be unified with the alloy graph of the main workspace.
[workspace]
