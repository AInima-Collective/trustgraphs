[package]
name = "trustgraphs-nostr-program"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "nostr-conformance"
path = "src/conformance.rs"

[[bin]]
name = "nostr-workspace"
path = "src/nostr_workspace.rs"

[dependencies]
alloy-primitives = { version = "1", features = ["serde"] }
nostr-envelope = { path = "../../../packages/nostr-envelope" }
nostr-workspace-core = { path = "../../../packages/nostr-workspace-core" }
pagerank-core = { path = "../../../packages/pagerank-core" }
sp1-zkvm = "=6.3.1"
zk-core = { path = "../../../packages/zk-core" }
