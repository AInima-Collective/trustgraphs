[package]
name = "trustgraph-weighted-program"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "trustgraph-weighted-program"
path = "src/main.rs"

[dependencies]
sp1-zkvm = "=6.6.0"
weighted-prior-core = { path = "../../crates/weighted-prior-core" }

# This is a distinct guest workspace on purpose: adding the weighted program cannot perturb any
# existing trust-graph, signer, contributions, Hypercerts, or conformance ELF dependency graph.
[workspace]

[patch.crates-io]
sha2 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha2", tag = "patch-sha2-0.10.9-sp1-6.2.0" }
sha3 = { git = "https://github.com/sp1-patches/RustCrypto-hashes", package = "sha3", tag = "patch-sha3-0.11.0-sp1-6.0.0" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
